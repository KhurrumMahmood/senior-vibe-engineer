name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (diff-scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history for `origin/main...HEAD` to resolve.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.6.9
          pip install -r requirements.txt

      # Registry checks run always (not diff-scoped) — drift in one ADR
      # can break links from another, so the whole registry is verified.
      - name: ADR registry link-check (hard)
        run: python3 scripts/decisions.py link-check

      # Audit is advisory in CI: the ecosystem ships intentionally
      # `proposed` starter ADRs and audit flags `proposed` ADRs older
      # than 30 days, so a hard gate would mean dated CI breakage. Emit
      # a warning annotation instead; pre-commit keeps audit a hard gate.
      - name: ADR registry audit (advisory)
        run: python3 scripts/decisions.py audit || echo "::warning::decision-registry audit reported drift (advisory) — see output above"

      # The skill frontmatter contract (scripts/skill_meta.py lint) validated only a
      # synthetic fixture, never the real skills — a bad tier/job enum or a missing
      # required field could land green. Run it registry-wide (like the ADR checks
      # above), always, hard. Stdlib-only, no extra deps. Flip to `lint --strict` to
      # also forbid contract-less legacy skills once that ratchet is wanted.
      - name: Skill frontmatter contract (registry-wide)
        run: python3 scripts/skill_meta.py lint

      # find-skill-artifact-drift Band-A run, registry-wide and advisory.
      # The ecosystem ships pre-existing reference drift (e.g. a SKILL.md
      # documenting renamed scanner scripts), so a hard gate would mean
      # dated CI breakage. Emit a warning; pre-commit keeps the
      # changed-files Band-A gate hard — same coverage-ratchet split as the
      # ADR audit above.
      - name: Skill-artifact drift (advisory, registry-wide)
        run: python3 .claude/skills/find-skill-artifact-drift/scripts/detect.py --gate || echo "::warning::find-skill-artifact-drift reported Band-A reference drift (advisory) — see output above"

      # /which-cleanup referential integrity (ADR 0023): every skill the subsystem
      # registry + closeout floor can recommend must resolve to a real skill dir.
      - name: which-cleanup referential integrity (hard)
        run: python3 .claude/skills/which-cleanup/scripts/coverage.py check

      - name: Compute changed Python files vs main
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="origin/main"
          fi
          git fetch origin "${BASE#origin/}" --depth=50 || true
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" -- '*.py' | tr '\n' ' ')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $FILES"

      - name: Run ruff on changed files
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Run ecosystem AST lint rules on changed files
        if: steps.changed.outputs.files != ''
        run: python3 scripts/lint/run.py --changed-from "${{ steps.changed.outputs.base }}" --rule all

      - name: Verify lint fixtures still parse
        if: steps.changed.outputs.files != ''
        run: |
          # If any lint rule or fixture file changed, run the matching
          # rule against both _bad and _good to catch drift between rule
          # and fixtures at PR time. Cheap, catches the "fixtures became
          # stale" class of regression.
          FIXTURE_CHANGES=$(printf '%s\n' ${{ steps.changed.outputs.files }} \
            | grep -E '^(scripts/lint/|tests/lint/)' || true)
          if [ -z "$FIXTURE_CHANGES" ]; then
            echo "No lint-rule or fixture changes — skipping fixture verification."
            exit 0
          fi
          echo "Lint rule/fixture changes detected — verifying all fixture pairs."
          set -e
          # Each pair: bad must exit non-zero (rule fires), good must exit 0.
          for rule in silent_catch no_stringly_typed_status no_query_mutation \
                      no_fat_view no_bare_delay no_comment_drift; do
            bad="tests/lint/${rule}_bad.py"
            good="tests/lint/${rule}_good.py"
            if [ -f "$bad" ]; then
              if python3 scripts/lint/${rule}.py "$bad"; then
                echo "FAIL: ${rule}_bad should exit non-zero"; exit 1
              fi
            fi
            if [ -f "$good" ]; then
              python3 scripts/lint/${rule}.py "$good"
            fi
          done
          echo "All fixture pairs behave correctly."

      - name: No Python changes — skipping lint
        if: steps.changed.outputs.files == ''
        run: echo "No .py files changed."

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The substrate test suite is small and fast — run it always,
      # not diff-scoped: a change anywhere can break a shared script.
      - name: Run pytest
        run: python3 -m pytest

      # Status-dashboard browser smoke (ADR 0037 / verification-policy UI
      # row): the rendered HTML must open from file:// in headless Chromium
      # with zero console errors and zero network requests. Playwright is a
      # CI-only dependency — locally the same test skips when playwright is
      # not installed, so the main pytest run above stays browser-free.
      - name: Renderer browser smoke (Playwright + Chromium)
        run: |
          pip install playwright
          python3 -m playwright install chromium --only-shell
          python3 -m pytest tests/test_render_status.py -q

      # The ecosystem's own guard: run every skill's scripts/smoke.py through
      # one aggregating gate. Blocking on smokes that exist (they must stay
      # green); missing smokes are reported, not failed — coverage climbs over
      # time, flip to --require-all when high enough. Runs always, not
      # diff-scoped: a shared `_common` change can break any skill's smoke.
      - name: Run skill ecosystem smokes
        run: python3 .claude/skills/_common/scripts/run_skill_smokes.py
