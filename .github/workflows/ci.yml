name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (diff-scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history for `origin/main...HEAD` to resolve.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.6.9
          pip install -r requirements.txt

      - name: Compute changed Python files vs main
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="origin/main"
          fi
          git fetch origin "${BASE#origin/}" --depth=50 || true
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" -- '*.py' | tr '\n' ' ')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $FILES"

      - name: Run ruff on changed files
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Run ecosystem AST lint rules on changed files
        if: steps.changed.outputs.files != ''
        run: python3 scripts/lint/run.py --changed-from "${{ steps.changed.outputs.base }}" --rule all

      - name: Verify lint fixtures still parse
        if: steps.changed.outputs.files != ''
        run: |
          # If any lint rule or fixture file changed, run the matching
          # rule against both _bad and _good to catch drift between rule
          # and fixtures at PR time. Cheap, catches the "fixtures became
          # stale" class of regression.
          FIXTURE_CHANGES=$(printf '%s\n' ${{ steps.changed.outputs.files }} \
            | grep -E '^(scripts/lint/|tests/lint/)' || true)
          if [ -z "$FIXTURE_CHANGES" ]; then
            echo "No lint-rule or fixture changes — skipping fixture verification."
            exit 0
          fi
          echo "Lint rule/fixture changes detected — verifying all fixture pairs."
          set -e
          # Each pair: bad must exit non-zero (rule fires), good must exit 0.
          for rule in silent_catch no_stringly_typed_status no_query_mutation \
                      no_fat_view no_bare_delay no_comment_drift; do
            bad="tests/lint/${rule}_bad.py"
            good="tests/lint/${rule}_good.py"
            if [ -f "$bad" ]; then
              if python3 scripts/lint/${rule}.py "$bad"; then
                echo "FAIL: ${rule}_bad should exit non-zero"; exit 1
              fi
            fi
            if [ -f "$good" ]; then
              python3 scripts/lint/${rule}.py "$good"
            fi
          done
          echo "All fixture pairs behave correctly."

      - name: No Python changes — skipping lint
        if: steps.changed.outputs.files == ''
        run: echo "No .py files changed."
