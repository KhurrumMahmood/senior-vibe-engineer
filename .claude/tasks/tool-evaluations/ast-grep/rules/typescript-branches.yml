id: pilot-typescript-branches
message: TypeScript direct-body complexity node for the structural-tool pilot
severity: info
language: TypeScript
rule:
  any:
    - kind: if_statement
    - kind: for_statement
    - kind: for_in_statement
    - kind: while_statement
    - kind: do_statement
    - kind: try_statement
    - kind: catch_clause
    - kind: with_statement
    - kind: switch_statement
    - kind: ternary_expression
    - pattern: $LEFT && $RIGHT
    - pattern: $LEFT || $RIGHT
