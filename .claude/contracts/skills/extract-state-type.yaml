schema_version: 2

skill: extract-state-type
job: explain
problem_class: "implicit-dict-state consolidation proposal (maintenance EXPLAIN/bridge)"
intent: >
  Read-only EXPLAIN skill that converts a function operating on an implicit mutable dict
  (or ad-hoc kwargs/namespace) into a typed @dataclass or TypedDict migration plan.
  Produces reports/extract-state-type/<target>/proposal.md with the current-shape table,
  proposed type definition, caller-by-caller migration plan, characterization-test matrix,
  and stop condition. Hands off to /fix-workflow or manual migration.
solves: >
  State threaded through a function as an untyped mutable dict / loose kwargs / namespace,
  where the shape is implicit and drift-prone — bridges a detected implicit-state finding
  into a concrete typed-shape migration plan.
