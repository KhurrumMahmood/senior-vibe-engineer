schema_version: 2

skill: extract-cotton-primitive
job: explain
problem_class: "frontend duplication resolution proposal (EXPLAIN/bridge)"
intent: >
  Turn a confirmed frontend-duplication finding (repeated card/pill/alert/menu
  shells across templates) into a django-cotton primitive extraction proposal:
  the proposed <c-name /> component, its prop surface, the call-site rewrite
  table, and a stop condition. Read-only — proposes the component, does not
  write it; hands off to /refactor-subsystem.
solves: >
  Duplicated template shells (the same card/alert/menu markup pasted across many
  templates) are detected but not directly actionable — the prop surface and
  every call-site rewrite must be mapped before a cotton primitive can replace
  them. This is the EXPLAIN bridge between detection and the refactor that
  executes it.
