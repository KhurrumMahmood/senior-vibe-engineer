schema_version: 2

skill: prevent-regression
job: guard
problem_class: "regression-guard authoring (GUARD) — turn a fixed bug into an executable rule"
intent: >
  After a bug is fixed (or a recurring smell is identified), author an executable guard —
  AST lint rule, test, or hook — that fails on the regression and passes on the fix, so the
  class of defect cannot silently return. GUARD skill at the closing end of the maintenance
  loop. Ships scripts/generate_rule.py + scripts/verify_rule.py to scaffold a rule and
  prove it discriminates (red on the pre-fix shape, green on the post-fix shape) before it
  is wired into CI/pre-commit.
solves: >
  Fixes that don't stick — a bug or pattern violation gets fixed once, then drifts back in
  later because nothing mechanically rejects the bad shape on the next change.
