schema_version: 2

skill: map-product-workflow
job: map
problem_class: "product-topology mapping (MAP) — workflow surface inventory"
intent: >
  Trace one end-to-end product workflow (e.g. a site setup/configuration surface)
  across every layer it touches — routes, views, templates, JS bundles, Celery
  tasks, models, status fields, boot payloads — and emit a durable workflow map at
  .claude/docs/workflows/<name>.md. MAP skill: read-only inventory, no proposals and no
  edits. It is the entry point of the product-topology loop (MAP → SUSPECT → EXPLAIN),
  giving the SUSPECT detectors and the registry proposer a single described surface to work
  against.
solves: >
  A product workflow whose authority is smeared across backend + templates + JS + tasks
  with no single document describing the whole surface, so nobody can see the full step
  inventory before hunting duplication or proposing a registry.
