schema_version: 2

skill: find-route-sprawl
job: suspect
problem_class: "product-topology drift detection (SUSPECT) — route ownership sprawl"
intent: >
  Detect route prefixes for a product workflow that are scattered through flat URL
  modules (default core/urls.py) without path('', include()) ownership boundaries, or
  duplicated as ambiguous API aliases. A stdlib detector emits four bands
  (flat_site_page_routes, flat_site_scoped_api_routes, missing_workflow_include,
  duplicate_route_alias_surface) into a report; no code or route changes.
solves: >
  Routes that are technically valid but hard to own because they live in a flat URL
  namespace — no include boundary means no single place owns a workflow's URL surface,
  and alias duplication makes the canonical route ambiguous.
