# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: gut-check
job: teach
problem_class: cross-cutting instinct pass (TEACH) — does-this-look-dumb reaction
intent: An instinctive senior-engineer 'does this look dumb?' reaction pass over a plan markdown, a commit
  diff, or a free-form architecture summary. Emits 3-5 cited smell reactions split into un-decided smells
  (no precedent/ADR covers them — raw signal) and decided-but-still-smell (an ADR/precedent explains the
  choice, but the smell still surfaces). Confidence-banded (strong-smell / weak-smell / style-preference).
  Prompt-only, no helper script.
solves: The moment a design goes from 'designed' to 'built' with nobody flinching at a wrong shape, over-engineering,
  or hidden coupling. Highest-leverage output is decision-conflict flagging — surfacing a smell that already
  contradicts a precedent or ADR so the human knows BOTH that it smells AND that a deliberate decision
  contradicts it. Produces SIGNAL, not VERDICT.
