evidence:
- 90f8567 — born in the big-bang ecosystem-extraction commit alongside 54 sibling skills (temporal weak;
  textual weak — the big-bang subject does not name this skill)
- SKILL.md dir contains only SKILL.md (no scripts/agents/knowledge) — confirms the 'prompt-only, no helper
  script' design (structural high)
- SKILL.md body uses placeholder 'ADR NNNN (slug)' and reads .claude/docs/precedents.yml as the optional
  decision-conflict source — it is deliberately portable and cites NO project-specific ADR ids (diverges
  from pnci's gut-check, which cited ADR 0001/0006/0008/0017)
gaps:
- Dogfood:low — prompt-only skills leave no run artifacts, so what it was first exercised on is not recoverable
  from git or disk.
- 'ES2''s gut-check is the portable form: it references precedents.yml + architectural-smells.md as mechanisms
  but embodies no specific ADR (it cites a placeholder ''ADR NNNN (slug)'', naming none). The pnci contract''s
  adr:[0001,0006,0008,0017] are pnci exemplars and do not transfer.'
