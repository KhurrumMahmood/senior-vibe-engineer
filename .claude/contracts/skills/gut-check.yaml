duplication_risk:
- with: architecture-fit
  relation: sibling-different-layer
  disambiguator: 'gut-check is lean instinct (SIGNAL, no ground truth); architecture-fit is systematic
    decision-registry validation of a plan (VERDICT-bearing). gut-check not_for: ''Plan validation against
    decisions (use /architecture-fit).'' and escalate_to names architecture-fit when the plan needs systematic
    validation.'
- with: teach-pattern
  relation: sibling-different-layer
  disambiguator: 'gut-check not_for quote: ''Pattern-rule briefing — explain why we do X (use /teach-pattern).''
    — gut-check reacts to a specific artifact; teach-pattern briefs a named rule.'
- with: decide
  relation: sequential
  disambiguator: 'gut-check escalate_to: ''/decide when a repeat smell suggests a decision should be revisited''
    — gut-check surfaces the conflict, /decide authors/amends the ADR.'
