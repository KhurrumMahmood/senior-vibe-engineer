schema_version: 2

skill: architecture-fit
job: plan
problem_class: "System-tier planning judgment (PLAN)"
intent: >
  Third stage of the System-tier planning chain. Reads an `impacted`-status plan,
  walks the impact map against the decision registry, canonical-patterns, and
  architectural-smells, and surfaces every material fork that needs an ADR — filling
  §5 (Architecture Fit) and §6 (Open Decisions) before the plan is promoted to a spec.
  It is the last judgment pause; it recommends `/decide` candidates inline but never
  authors ADRs or scaffolds the spec itself.
solves: >
  Promoting a feature plan to implementation without first checking it against existing
  decisions / smells, so design forks (build-vs-buy, sync-vs-async, FK-vs-enum,
  new-model-vs-extend, new-subsystem-vs-absorb) get silently decided during coding
  instead of deliberately at planning time.
