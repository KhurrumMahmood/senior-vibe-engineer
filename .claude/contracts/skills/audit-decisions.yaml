schema_version: 2

skill: audit-decisions
job: guard
problem_class: "decision-registry hygiene audit (GUARD)"
intent: >
  Audit decision-registry hygiene and validate inline decision references in
  Python comments, Markdown/HTML references, and TypeScript/TSX comments.
  Preserve registry/link diagnostics in a final read-only report and fail
  explicitly when a supported source language cannot be parsed reliably.
solves: >
  Decisions rot silently — a proposed ADR that nobody accepted/deprecated, a
  superseded-by pointer to a missing entry, an applies_to glob whose target was
  deleted. audit-decisions is the narrow, authoritative read of decision-tree
  health so the rot is visible before it misleads future work.
