schema_version: 2

skill: propose-folder-reorganization
job: explain
problem_class: "folder-topology drift resolution proposal (EXPLAIN/bridge)"
intent: >
  Turn a confirmed /find-folder-topology-drift finding into a per-cluster
  reorganization proposal. Consumes a finding (or explicit target like
  core/views::site_config) and emits a proposal with the current -> proposed
  tree, file-move table, import-impact summary, characterization-test matrix,
  and stop condition. Read-only — no file moves. Hands off to
  /refactor-subsystem (decomposition mode).
solves: >
  Folder-topology drift (flat folders with N+ same-prefix siblings that should be
  a package, tests-by-prefix that belong under a tests/ subfolder, packages
  fallen below the >=3 threshold) is detected but not directly actionable — the
  move table and import impact must be mapped first before a safe migration.
