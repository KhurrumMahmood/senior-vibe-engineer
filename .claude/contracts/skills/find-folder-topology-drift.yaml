schema_version: 2

skill: find-folder-topology-drift
job: suspect
problem_class: "folder-topology drift detection / placement-convention guard (SUSPECT)"
intent: "Detect drift on the folder-topology surface against the bidirectional ≥3-sibling threshold — promote-direction (same-prefix sibling sprawl, tests_*.py populations that should be folders, URL-prefix views ungrouped, same-domain helper sprawl at root) and demote-direction (folder packages whose source-module count fell below ≥3). Read-only; hands off to /propose-folder-reorganization then /refactor-subsystem."
solves: "Directory layout silently violating the project's folder-grouping convention — flat folders that should be packages and over-eager packages that should collapse — which the folder-organization convention codifies but nothing enforces between refactors."
