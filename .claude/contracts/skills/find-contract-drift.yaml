schema_version: 2

skill: find-contract-drift
job: suspect
problem_class: "cross-layer contract drift detection / product-topology (SUSPECT)"
intent: >
  Advisory SUSPECT scan for `/sites` cross-layer contract drift beyond boot globals —
  endpoint keys, DOM IDs, `data-*` selectors, template-called JS exports, and JSON/boot
  payload fields. Imports the `/find-frontend-contract-drift` boot-global detector and
  adds route-surface contract bands.
solves: >
  Silent disagreement between `/sites` templates, static JS, the site workflow registry,
  and API payloads — a JS call references an endpoint key or DOM ID the registry/template
  no longer provides, breaking the route only at runtime.
