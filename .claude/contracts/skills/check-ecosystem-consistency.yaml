skill: check-ecosystem-consistency
job: suspect
problem_class: "ecosystem self-consistency audit (SUSPECT)"
intent: "Diff-aware ecosystem consistency audit for engineering-skills. Snapshots skills, /which-shape shape-routing references, docs skill-count claims, and catalog coverage; compares with the last reviewed state (.claude/ecosystem/last-state.json) so significant skill changes surface follow-up obligations — catalogue coverage, count updates, and a conscious review of whether shapes.yml needs an update. Advisory: state is only written with --update-state, after findings are reviewed."
solves: "Adding, removing, or materially repurposing a skill creates coordination obligations (skill-catalog coverage, README/ONBOARDING count claims, a possible /which-shape registry update) that are silently forgotten. There was no diff-against-reviewed-state pass that flags 'this skill changed — did you reconsider the shape registry and the count surfaces?' before handoff or commit."
