duplication_risk:
  - with: track-idea
    relation: sequential
    disambiguator: "not_for quote: 'Capturing new ideas (use /track-idea intake). Adding lessons or transitions (use /track-idea event)'. orphaned-ideas is the READ-side audit; track-idea is the WRITE-side capture. orphaned-ideas --apply-stale is the one write exception (emits transition events via the same path)."
  - with: extract-existing-ideas
    relation: sequential
    disambiguator: "escalate_to quote: '/extract-existing-ideas when the plan-dropouts list reveals a systemic gap (many items missing)'. orphaned-ideas detects the drift; extract-existing-ideas does the backfill from prose."
  - with: find-dormant
    relation: sequential
    disambiguator: "orphaned-ideas --dead-prototype CONSUMES a /find-dormant report (--from-report) to raise orphan routes/templates as ledger candidates. find-dormant produces; orphaned-ideas reads."
