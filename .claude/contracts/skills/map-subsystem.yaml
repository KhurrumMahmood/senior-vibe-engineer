schema_version: 2

skill: map-subsystem
job: map
problem_class: "subsystem MAP — durable inventory doc"
intent: >
  Produce or refresh a durable inventory doc for a Python or TypeScript/TSX
  subsystem at .claude/docs/subsystems/<name>.md. The TypeScript v1 branch uses
  the host-pinned Compiler API and named tsconfig to inventory exported surface,
  resolved inbound/outbound imports, barrel boundaries, workflow participation,
  and diagnostic completeness without inventing unavailable judgment fields.
solves: >
  A subsystem nobody can change confidently because its public surface,
  responsibilities, and dependency edges live only in the code — the map makes
  the load-bearing contract (what outside callers see) explicit and durable.
