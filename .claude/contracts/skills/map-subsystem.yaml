dogfooded_on:
  - "none-found — extracted big-bang into ES2 (90f8567), not dogfooded in this repo. ES2 has no host subsystems to map: no .claude/docs/subsystems/<name>.md outputs and no reports/map dir on disk. Has a scripts/ doc generator but no fixtures/ oracle."
reports_dir: none
run_evidence:
  count: 0
  first: null
  latest: null
embodies_decisions:
  adr: []
  precedent: []
  doc: ["skill-catalog.md"]
  contract: []
related_skills: [map-product-workflow, explain-code, refactor-subsystem, find-omnibus]
duplication_risk:
  - with: map-product-workflow
    relation: sibling-different-layer
    disambiguator: "Both MAP skills writing durable .claude/docs/ docs, but map-subsystem inventories ONE code subsystem (→ subsystems/<name>.md); map-product-workflow spans a cross-subsystem user-visible workflow (→ workflows/<name>.md). map-subsystem not_for: 'Cross-subsystem product workflows (use /map-product-workflow).'"
  - with: explain-code
    relation: sibling-different-layer
    disambiguator: "map-subsystem is inventory (file list / public surface / dep graph); explain-code is per-symbol behavioral annotation. map-subsystem not_for: 'Per-symbol behavior annotation (use /explain-code).'"
  - with: refactor-subsystem
    relation: sequential
    disambiguator: "map-subsystem is read-only inventory feeding the loop; refactor-subsystem executes a spec-driven refactor. map-subsystem not_for: 'Refactor execution (use /refactor-subsystem with a spec).'"
provenance_confidence:
  textual: low
  structural: med
  temporal: low
  dogfood: low
evidence:
  - "90f8567 — born in the big-bang ES2 extraction (54 sibling skills share this commit); temporal signal is weak"
  - "has scripts/ doc generator + knowledge/ output-format spec; no fixtures/ oracle (has_fixtures false)"
  - "no .claude/docs/subsystems/ outputs and no reports/map dir on disk in ES2 — nothing mapped here"
gaps:
  - "DIVERGENCE from the pnci intent base: pnci classed this subsystem-refactor (two real subsystems mapped to .claude/docs/subsystems/views-collections.md + views-crawling.md, co-born with GUARD lints). ES2 is the portable skill ecosystem with no host subsystems, so nothing has been mapped and dogfood_kind is none-found."
  - "embodies_decisions.adr is []: ADR 0017 (staged-boundary) names map-subsystem only as a context/signal source feeding the planning chain, not as the enforcement/realization of the decision, so it is not attributed."
