schema_version: 2

skill: map-subsystem
job: map
problem_class: "subsystem MAP — durable inventory doc"
intent: >
  Produce or refresh a durable inventory doc for a subsystem at
  .claude/docs/subsystems/<name>.md — file list, public surface, responsibility
  table, dependency graph, and convention-compliance score. The MAP job of the
  five-jobs maintenance nervous system; its output feeds every downstream
  SUSPECT/EXPLAIN/REFACTOR pass on the same subsystem, so it must be accurate,
  re-readable without the skill loaded, and cheaply refreshable. No refactor intent.
solves: >
  A subsystem nobody can change confidently because its public surface,
  responsibilities, and dependency edges live only in the code — the map makes
  the load-bearing contract (what outside callers see) explicit and durable.
born:
  commit: "90f8567"
  date: "2026-05-15"
  sibling_births: [architecture-fit, audit-decisions, brainstorm-ideas, decide, design-it-twice, engineer-init, explain-code, extract-cotton-primitive, extract-enum, extract-existing-ideas, extract-state-type, extract-workflow-registry, find-async-lifecycle-drift, find-comment-drift, find-contract-drift, find-dead-route-surface, find-doc-route-drift, find-dormant, find-duplication, find-folder-topology-drift, find-frontend-contract-drift, find-frontend-duplication, find-implicit-state, find-layer-violation, find-omnibus, find-orphaned-ideas, find-query-mutation, find-route-sprawl, find-rule-surface-drift, find-semantic-duplication, find-stale-artifacts, find-test-obligation-drift, find-transaction-overreach, find-workflow-duplication, find-workflow-state-gaps, fix-workflow, gut-check, impact-feature, introduce-fk, map-product-workflow, mature-existing-ideas, plan-feature, plan-spec, prevent-regression, propose-boundary, propose-folder-reorganization, query-patterns, refactor-subsystem, scope-feature, teach-pattern, track-idea, triage-debt, unify-shadows, which-skill]
