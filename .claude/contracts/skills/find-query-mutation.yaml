schema_version: 2

skill: find-query-mutation
job: suspect
problem_class: "architectural-drift detection (SUSPECT) — query-mutation smell"
intent: >
  Detect read-named methods (get_* / fetch_* / load_* / list_* / find_* / check_*) whose
  bodies mutate persisted state via .save() / .delete() / .update() / .create() / bulk_* /
  update_or_create() / get_or_create(). An AST scan collapses hits per function and fans
  out cheap scout sub-agents to bucket each candidate (rename / split / legitimate
  cache-warming / stdlib false positive) before handoff to /fix-workflow cluster:<symbol>.
solves: >
  Functions whose name lies about their side effects — a structurally-valid read accessor
  that secretly writes the database, which surprises callers and corrupts the read/write
  contract a reader relies on.
