schema_version: 2

skill: design-it-twice
job: decide
problem_class: "design-fork resolution by parallel fan-out (cross-cutting DECIDE)"
intent: >
  Resolve a material design fork by parallel-divergent fan-out — spawn 3 designer
  sub-agents with deliberately different binding constraints, then synthesize a
  comparative analysis with a recommendation. Writes one comparative-design document
  under reports/design-it-twice/scan-<TS>/. Does NOT author the ADR — /decide is the
  downstream step. Pattern inspired by mattpocock/skills' "design-it-twice".
solves: >
  Committing to one side of a high-cost design fork (architecture, interface shape, data
  model, build-vs-buy, sync-vs-async, FK-vs-enum) before the alternatives have been
  explored, when the ADR Decision sentence can't be written yet without speculation and
  being wrong means an expensive rewrite.
