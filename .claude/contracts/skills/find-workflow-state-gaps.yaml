skill: find-workflow-state-gaps
job: suspect
problem_class: "UI state-coverage drift detection (SUSPECT, advisory)"
intent: >
  Advisory scan for workflow state-coverage gaps in JavaScript and templates —
  loading, empty, failure, retry/cancel, disabled, and mobile states. Bands: missing_loading_state, missing_empty_state,
  missing_failure_state, missing_recovery_state, missing_disabled_state,
  missing_mobile_state. Also imports /find-workflow-duplication findings as
  state-authority context. Text-surface advisory — findings need judgment
  before becoming guardrails.
solves: >
  A /sites tab or async panel shipped without the states a senior engineer
  expects before UI polish — no loading spinner, no empty state, no failure /
  retry path, no disabled or stale-job handling — surfaced before the next
  async panel is added or after a route/template/JS ownership move.
