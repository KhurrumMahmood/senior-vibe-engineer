schema_version: 2

skill: find-workflow-duplication
job: suspect
problem_class: "product-topology drift detection (SUSPECT) — duplicated step authority"
intent: >
  Detect duplicated product-step authority — step labels, tab IDs, route literals,
  endpoint suffixes, sidebar/dashboard step definitions, boot payload keys, and status
  text — repeated across backend, templates, JS, and docs for one product workflow
  (default: sites) instead of owned by a single registry. A stdlib detector with
  --min-active-owners 2 emits per-owner findings, each surface-classified
  (active_executable / legacy_unloaded / route_definition / docs / tests) so lexical
  repeats are treated as evidence, not findings.
solves: >
  The same workflow-step knowledge re-typed in every layer, so a label or tab id change
  has to be hunted across Python + templates + JS + docs and silently drifts when one copy
  is missed.
