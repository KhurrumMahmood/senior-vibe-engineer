# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: find-complexity-hotspots
job: suspect
problem_class: performance / complexity hotspot detection (SUSPECT)
intent: Surface likely algorithmic, Django ORM, and structural complexity hotspots as read-only advisory
  leads. Preserve the six-band Python stdlib-AST scan, and add a narrow TypeScript Compiler API path for
  syntactic branch scores on function declarations, methods, and block-bodied arrows — without framework,
  type, receiver, runtime-cost, automatic-refactor, or production-write claims.
solves: Expensive code paths grow silently; before a refactor there was no first-pass, repo-wide lead
  list of where complexity concentrates, so reviewers guessed at 'this feels slow.'
