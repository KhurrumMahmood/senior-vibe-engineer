schema_version: 2

skill: explain-code
job: explain
problem_class: "behavioral annotation (maintenance EXPLAIN)"
intent: >
  Read-only EXPLAIN skill that converts a file, directory package, or named subsystem
  into an annotated behavior doc at reports/explanations/<target>.md. Fans out scout
  sub-agents per public symbol to capture intent, pre/postconditions, invariants,
  callers, and unexplained regions. Complements /map-subsystem (inventory) by adding the
  behavioral annotation that lets a human trust the code enough to change it.
solves: >
  Not being able to safely change a region because its behavior, invariants, and callers
  are undocumented — inventory alone (what's there) doesn't confer the trust needed to
  edit (what it does and must keep doing).
