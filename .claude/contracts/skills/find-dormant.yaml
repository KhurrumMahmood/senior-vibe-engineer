schema_version: 2

skill: find-dormant
job: suspect
problem_class: "dead / dormant code detection (SUSPECT)"
intent: >
  Read-only scan that surfaces likely-dead code — symbols, functions, modules,
  and routes with no live references — ranked from certain-delete down to
  needs-review, as advisory leads without touching production files.
solves: >
  Dead code accumulates and obscures the live system; there was no first-pass,
  repo-wide lead list of what is unreferenced, so reviewers feared deleting code
  that might still be reachable and left it to rot instead.
