schema_version: 2

skill: find-dormant
job: suspect
problem_class: "dead / dormant code detection (SUSPECT)"
intent: >
  Read-only scan that surfaces likely-dead code without touching source.
  Python preserves its staged scout verdicts; TypeScript/TSX v1 uses a
  project-local Compiler API to report non-exported top-level implementations
  with zero resolved static references as human-review or uncertain candidates,
  never as certainly safe to delete.
solves: >
  Dead code accumulates and obscures the live system; there was no first-pass,
  repo-wide lead list of what is unreferenced, so reviewers feared deleting code
  that might still be reachable and left it to rot instead.
