  structural: high  # selected skill now contains a self-contained discovery/evidence runtime plus committed language fixtures
  temporal: high     # small 3-skill birth cohort — birth proximity is informative (unlike the big-bang 90f8567 set)
  dogfood: med      # fixture oracle plus a fresh stock-installed external-host journey; no committed self-scan
