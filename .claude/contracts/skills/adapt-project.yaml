# Skill intent + provenance contract — schema v2.
# ES2-only skill; authored fresh from SKILL.md + es2_skill_facts.yaml.

schema_version: 2

skill: adapt-project
job: meta
problem_class: "host-project discovery / adapter scaffolding (META)"
intent: "Discover objective host-project facts and scaffold a project adapter for engineering-skills — stack markers, commands, tests, CI, docs, and authored source roots for Python, JavaScript-family, TypeScript/TSX, Go, Java, plus a marker-backed filesystem baseline for PHP/Composer, Ruby/Bundler, Rust/Cargo, and Dart/Pub before any richer provider is loaded. Source counts participate in the same large-root caution while generated/vendor/dependency/build/test/example trees stay excluded; package metadata never proves a framework. Writes timestamped evidence by default, requires --apply for the durable host adapter, and keeps the general scanner's --no-host-write artifacts outside the host."
solves: "Localizing the portable engineering-skills ecosystem to a new repo needs the operational facts (stack/commands/tests/CI/source roots) gathered objectively. There was no read-only discovery pass that produces a machine-readable adapter while explicitly refusing to confuse observed frequency with health — a messy repo's repeated patterns are flagged 'do not standardize yet', not canonized."
born:
  commit: "a582cbf"
  date: "2026-05-16"
  sibling_births: [find-complexity-hotspots, project-interview]   # small, sharp 3-skill cohort — temporal signal is meaningful
dogfood_kind: fixture-pair
dogfooded_on:
  - "Committed Python/TypeScript positive, boundary, exclusion, copied-install, and hostile-path fixtures exercise final adapter/report/evidence artifacts."
  - "Fresh stock-installed TypeScript-host journey at /private/tmp/adapt-project-typescript-forward.qABrrP produced a useful read-only adapter and exposed the documented-command defect later pinned by regression."
  - "Pinned read-only real-repository discovery on Requests, Got, go-chi/chi, and Spring PetClinic exposed and then verified pytest configuration, source/ layout, arbitrary Go package, and Java no-regression behavior."
  - "Pinned no-host-write discovery on Slim, Sinatra, byteorder, and dart-lang/path verified PHP/Composer, Ruby/Bundler, Rust/Cargo, and Dart/Pub markers, authored source roots, and conventional command guidance."
