problem_class: "scoped refactor execution for a single finding (REFACTOR)"
intent: >
  Execute a scoped fix for one confirmed maintenance-loop finding (a layer
  violation, a duplication cluster, a query-mutation pair, a dormant-delete
  target) under behavior-preserving discipline: pin current behavior, make the
  smallest responsible change, prove the failure is gone. The targeted-execution
  counterpart to /refactor-subsystem's larger decompositions.
solves: >
  SUSPECT skills produce findings but do not fix them, and /refactor-subsystem is
  sized for whole-subsystem decompositions; there was no disciplined executor for
  a single small finding, so point-fixes were done ad hoc without the pin-change-
  prove guardrail.
