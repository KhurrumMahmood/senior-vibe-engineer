schema_version: 2

skill: find-standard-gaps
job: suspect
problem_class: "declared-standard coverage-gap detection (SUSPECT)"
intent: "Detect places a declared baseline standard should apply but doesn't. A standard (a security check, resilience rule, input-validation or observability requirement) is declared once as an entry with an executable `ast` detector; scan_coverage.py then scans the tree and reports every site whose triggering situation holds but the standard is absent. Generalizes hand-written AST lints — declare a standard instead of authoring a bespoke one-off lint. Deterministic (no scout fan-out); detection-only, never edits code."
solves: "A good standard is worth nothing at the sites that don't use it, and authoring one bespoke AST lint per rule does not scale. There was no declarative 'absence is the finding' pass that coverage-checks a baseline standard across the tree — and the genuinely dangerous failure mode (a silent '0 gaps' on an unanalyzable language) had no guard until language_unsupported was made a first-class, non-compliant result."
