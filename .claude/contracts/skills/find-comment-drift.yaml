schema_version: 2

skill: find-comment-drift
job: suspect
problem_class: "comment / code drift detection (SUSPECT)"
intent: >
  Read-only stdlib scan that surfaces comments and docstrings likely to have
  drifted from the code they describe (stale references to renamed symbols,
  contradicted counts/paths, TODO/FIXME rot), ranked as advisory leads without
  touching production files.
solves: >
  Comments lie as code changes around them; there was no first-pass, repo-wide
  lead list of where prose has drifted from behavior, so reviewers only caught
  stale comments by accident during unrelated reads.
