schema_version: 2

skill: find-comment-drift
job: suspect
problem_class: "comment / code drift detection (SUSPECT)"
intent: >
  Read-only stdlib scan that surfaces likely comment, docstring, JSDoc, and
  template-comment drift across Python, JavaScript/JSX, TypeScript/TSX, and
  HTML. Its repository guard reuses the detector's narrower blocking subset;
  all findings remain review leads rather than authorization to rewrite code.
solves: >
  Comments lie as code changes around them, while AI-grown code also accumulates
  narration, detached banners, ceremonial JSDoc, and brittle line references.
  The shared detector gives reviewers and the guard one explicit first-pass
  contract instead of divergent language-specific heuristics.
