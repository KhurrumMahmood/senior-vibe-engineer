schema_version: 2

skill: extract-existing-ideas
job: meta
problem_class: "ledger bootstrap from existing prose (cross-cutting META)"
intent: "Walk existing prose surfaces (BACKLOG.md, lessons.md, plan files) and propose candidate ledger intakes for items already named there. Read-only by default — emits a candidates JSON and a report, then hands off to /brainstorm-ideas' helper script for the actual write so dedup, validation, and origin discipline stay in one place."
solves: "Work already captured in BACKLOG.md / lessons / plans never making it into the ledger — bootstraps the ledger on an existing project and catches backlog items that bypassed /track-idea."
