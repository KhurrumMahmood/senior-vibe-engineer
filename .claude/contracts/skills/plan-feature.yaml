duplication_risk:
- with: scope-feature
  relation: sibling-different-layer
  disambiguator: 'plan-feature `not_for`: ''New subsystems or 2+ workflows (use the System-tier chain
    ...)''; `escalate_to`: /scope-feature when impact surfaces 2+ subsystems. plan-feature is Feature-tier
    (one workflow); scope-feature starts the heavier System-tier chain. Tier is the disambiguator.'
- with: plan-spec
  relation: sibling-different-layer
  disambiguator: Both scaffold a spec, but plan-feature scaffolds DIRECTLY at Feature tier (proposed status,
    no prior plan), while plan-spec is the TERMINAL System-tier step promoting an architected plan. Different
    entry conditions.
