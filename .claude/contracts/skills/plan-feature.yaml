# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: plan-feature
job: plan
problem_class: Feature-tier planning (PLAN)
intent: Plan a Feature-tier change (1-3 day scope, touches one workflow, needs impact analysis but not
  a new subsystem). Reads subsystem/workflow docs, canonical patterns, smells, and the decision registry;
  fans out scouts per touched subsystem to map call sites + model touchpoints + behaviors-to-preserve;
  surfaces decision stubs for material forks; scaffolds a proposed-status spec under ai-docs/specs/<feature>.md
  so implementation resumes from the spec.
solves: 'Mid-size features either skip planning (and lose call-site/behavior coverage) or get force-fit
  into the heavyweight System-tier chain. plan-feature is the right-sized middle: scout fan-out + spec
  scaffold without the multi-stage judgment pauses System-tier work needs.'
