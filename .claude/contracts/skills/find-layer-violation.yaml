schema_version: 2

skill: find-layer-violation
job: suspect
problem_class: "architectural layer-violation detection (SUSPECT)"
intent: >
  Read-only scan that surfaces likely layer-boundary violations — views reaching
  past the service layer into the ORM, business logic embedded in templates or
  views, cross-layer imports that skip the intended seam — ranked as advisory
  leads without touching production files.
solves: >
  Layer boundaries erode silently as logic leaks into the wrong tier; there was
  no first-pass, repo-wide lead list of where the view/service/model seams are
  crossed, so the architecture decayed without a signal to extract a service.
