schema_version: 2

skill: extract-workflow-registry
job: explain
problem_class: "product-workflow canonical-registry proposal (maintenance EXPLAIN/bridge)"
intent: >
  Propose a canonical registry for a mapped product workflow: step id, label, route_name,
  url_builder, visibility_rule, status_provider, active_tab_key, template_owner,
  frontend_boot_keys, and registry-owned endpoint payloads (api_endpoints /
  api_endpoint_templates). EXPLAIN skill — no code edits. Consumes a mapped workflow
  (default .claude/docs/workflows/sites.md) plus topology-drift findings and turns scattered
  step authority into a single registry proposal a later refactor can implement.
solves: >
  Product-step authority (labels, tab ids, route literals, status providers, boot keys,
  endpoint suffixes) duplicated across backend / templates / JS / docs with no canonical
  registry — bridges a mapped workflow into a single-source-of-truth registry proposal.
