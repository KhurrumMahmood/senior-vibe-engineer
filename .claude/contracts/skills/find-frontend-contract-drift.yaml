schema_version: 2

skill: find-frontend-contract-drift
job: suspect
problem_class: "template-to-JS boot contract drift / product-topology (SUSPECT)"
intent: >
  Detect implicit template-to-JS boot contracts: scattered `window.*` globals, undeclared
  JS reads of template-set globals, repeated reads that should funnel through a canonical
  boot payload, and globally-loaded JS auto-init that fetches/mutates DOM without a page
  marker.
solves: >
  Server templates and browser JS communicating through undocumented global variables
  instead of a declared boot payload — fragile coupling that breaks silently when either
  side renames a global.
