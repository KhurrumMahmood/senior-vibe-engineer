schema_version: 2

skill: find-transaction-overreach
job: suspect
problem_class: "runtime-failure-mode detection (SUSPECT) — transaction overreach"
intent: >
  Detect Django transaction.atomic() blocks (and @transaction.atomic functions) that hold
  a DB connection while doing slow / external work — HTTP calls, AI/SDK calls, cloud
  uploads, time.sleep, subprocess, or Celery dispatch. An AST scan collapses hits per
  block and fans out cheap scout sub-agents to bucket each candidate (narrow / split /
  defer / legitimate / false positive) before handoff to /fix-workflow cluster:<symbol>.
solves: >
  A smell that passes structural review but starves the connection pool under load: a
  transaction pins a database connection across a network round-trip or other slow work,
  so concurrent requests exhaust available connections.
