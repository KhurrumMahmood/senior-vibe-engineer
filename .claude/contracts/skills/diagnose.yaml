schema_version: 2

skill: diagnose
job: diagnose
problem_class: "debugging-loop construction (maintenance DIAGNOSE)"
intent: >
  Build a trustworthy debugging loop for hard bugs, regressions, and intermittent
  failures BEFORE changing code — establish a reproduction (or the reason one is not
  possible), find the root cause, and verify the fix. Writes an index report under
  reports/diagnose/scan-<TS>/diagnosis.md plus the evidence files the frontmatter
  evidence contract requires (reproduction_or_reason, root_cause, fix_verification,
  cleanup_check). Carries a max-overhead stop (30 min without a credible loop → write
  what artifact/access is missing).
solves: >
  Fixing hard / unclear / intermittent bugs by guesswork instead of a reproducible loop
  and measured root cause — the "change code and hope" failure mode that a
  reproduce-bugs-first discipline targets.
born:
  commit: "8793ef0"
  date: "2026-05-16"
  sibling_births: [plan-skill]
dogfood_kind: none-found
