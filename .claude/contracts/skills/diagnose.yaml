  - "frontmatter carries a full contract (consumes/produces/evidence_required/risk_triggers/max_overhead) and the body wires scripts/evidence_gate.py check --skill diagnose, but that path is a host-runtime path — ES2's diagnose dir has no scripts/"
  - "no scripts/ and no fixtures/ in the ES2 skill dir; no reports/diagnose run dir on disk"
