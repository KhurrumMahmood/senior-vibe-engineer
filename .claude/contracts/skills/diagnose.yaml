related_skills: [fix-workflow, prevent-regression, gut-check, find-implicit-state]
duplication_risk:
  - with: fix-workflow
    relation: sequential
    disambiguator: "diagnose builds the loop + root cause for an UNREPRODUCED symptom; fix-workflow executes a KNOWN cleanup cluster from a find-* report ('not_for: Known cleanup clusters from a find-* report (use /fix-workflow ...)'). escalate_to fix-workflow once the root cause is understood."
  - with: prevent-regression
    relation: sequential
    disambiguator: "diagnose finds + verifies the fix; prevent-regression turns the post-mortem's repeatable guardrail into a lint/test (named in escalate_to)."
  - with: gut-check
    relation: sibling-different-layer
    disambiguator: "diagnose needs a LIVE symptom and builds a measured loop; gut-check is an instinctive smell pass with no live symptom ('not_for: Broad architecture improvement without a live symptom (use /gut-check ...)')."
