schema_version: 2

skill: find-frontend-duplication
job: suspect
problem_class: "frontend duplication detection (SUSPECT)"
intent: >
  Detect duplicated UX shells, hand-rolled primitives, and JS helper forks across
  templates/ and static/js/ by comparing Tailwind class chains and JS function
  definitions against the existing cotton primitive inventory — surfacing
  'should be a c-primitive but isn't' candidates. An orchestrator drives stdlib
  scanners (cotton inventory, class-chain, helper-fork), collapses + ranks into
  P0/P1/P2 candidates, and fans out investigator sub-agents; the orchestrator never
  reads markup itself. Hands off to /extract-cotton-primitive for proposals.
solves: >
  Hand-rolled modal/badge/alert/dropdown/button shells and forked JS helpers
  (showToast/escapeHtml/siteEndpoint) repeated across templates instead of going through
  one cotton primitive or wrapper.
