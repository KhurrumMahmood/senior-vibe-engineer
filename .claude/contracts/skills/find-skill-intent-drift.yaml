schema_version: 2

skill: find-skill-intent-drift
job: suspect
problem_class: "skill-catalogue intent/provenance drift detection (SUSPECT / meta-guard)"
intent: >-
  Make silent reversion of a skill's recorded purpose visible. Each skill's
  intent + provenance is captured in a machine-checkable contract under
  .claude/contracts/skills/<name>.yaml (schema v2); this guard compares those
  contracts against the actual skills and flags four drift bands (missing /
  orphaned / malformed / stale) so a reviewer notices when a skill's recorded
  "why it exists" no longer matches what it now does.
solves: >-
  The "no easy reversion of intent" gap — before this, a skill's problem class,
  scope, and dogfood provenance lived only in prose and git archaeology, so a
  rework could quietly erode or contradict the original intent with nothing to
  catch it, and cross-skill duplication relationships were never recorded. It is
  the intent/provenance layer of the skill-meta trio (frontmatter contract →
  artifact coherence → intent), the deepest of the three.
born:
  commit: "bad0fff"
  date: "2026-05-26"
  sibling_births: []          # only NEW skill dir in its introducing commit (bad0fff); shipped alongside the 67 sibling contracts + _schema.yaml (those skills were born earlier)
dogfood_kind: self-installed-guard
dogfooded_on:
  - "the ES2 contract corpus itself — scan.py ran against the full set this session (skills=68 / contracts=68, TOTAL findings: 0) and regenerated _index.yaml. Provenance was re-derived from ES2's own git history, not copied from the pnci host."
reports_dir: none             # meta-guard: durable output is the regenerated _index.yaml in the contracts dir, not a reports/<skill>/ run dir
run_evidence:
  count: 0
  first: null
  latest: null
embodies_decisions:
  adr: []                     # no ADR in ai-docs/decisions/ governs this freshly-ported guard; also a deliberately advisory drift-lint, not ADR-gated
  precedent: []
  doc: []
  contract: [".claude/contracts/skills/_schema.yaml"]
related_skills: [find-skill-artifact-drift, plan-skill, find-rule-surface-drift, which-skill]
duplication_risk:
  - with: find-skill-artifact-drift
    relation: sibling-different-layer
    disambiguator: "The skill-meta trio: find-skill-artifact-drift checks SKILL.md PROSE references (named scripts, documented --flags, declared tools) against the FILES ON DISK; find-skill-intent-drift checks the recorded INTENT/PROVENANCE contract against the skill. Artifact coherence vs intent freshness — adjacent layers, not overlap."
  - with: plan-skill
    relation: sequential
    disambiguator: "plan-skill AUTHORS/revises a skill (and should write or refresh its intent contract); find-skill-intent-drift DETECTS when that contract later drifts from the skill. Author vs audit."
  - with: find-rule-surface-drift
    relation: sibling-different-layer
    disambiguator: "find-rule-surface-drift guards the agent-rules DOC surface (CLAUDE.md trigger reachability, oversized always-loaded files, dormant docs); this guards skill INTENT contracts (why each skill exists). Different surfaces, both 'rules about the meta-layer'."
  - with: which-skill
    relation: sibling-different-layer
    disambiguator: "which-skill reads SKILL.md frontmatter to RECOMMEND a skill for a task; find-skill-intent-drift reads contracts to AUDIT intent freshness. Both read the catalogue, different jobs."
provenance_confidence:
  textual: med                # introducing commit bad0fff describes the guard ("advisory drift guard") but not by exact slug — med, not high
  structural: med             # scanner script present; no fixtures/ pair and no pre-commit/CI wiring (advisory by design)
  temporal: high              # born and dogfooded in the same session — maximal proximity (and not part of the big-bang 90f8567 set)
  dogfood: high               # ran clean against the full ES2 contract corpus this session; that IS the dogfood run
evidence:
  - "bad0fff — true birth of SKILL.md (introducing commit, 2026-05-26); all parents lack the file."
  - "scan.py — skills=68 / contracts=68, all four bands 0, TOTAL findings: 0; wrote _index.yaml (the dogfood run on the ES2 corpus)."
  - "ported from the pnci host as the portable schema+guard; ES2 contracts re-derived from ES2 git history (born SHAs, dogfooded_on, run_evidence are repo-specific)."
  - "_schema.yaml (schema v2) is the contract shape this guard enforces; _duplication-watchlist.yaml rolls up the duplication_risk[] blocks."
gaps:
  - "No fixtures/ good-bad pair and no pre-commit/CI wiring yet (advisory by design); structural signature is therefore partial."
  - "No reports/<skill>/ run dir exists or is expected — the durable, git-tracked output is _index.yaml, so there is no on-disk timestamped run_evidence to mine."
