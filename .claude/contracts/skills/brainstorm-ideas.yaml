schema_version: 2
skill: brainstorm-ideas
job: meta
problem_class: idea-capture / ledger intake generation (cross-cutting META)
intent: Generate a batch of candidate ledger intakes for a topic or context file, dedup against the existing
  ledger, and bulk-write the survivors as proposed-state intakes with origin AI-suggestion. The orchestrator
  does the creative work (N candidates with title / summary / hypothesis / subsystem_kind / markers);
  the helper script validates against duplicates and writes. Tier 1 of the idea-tracking system.
solves: Losing most of the thoughts surfaced in an exploratory session because only one or two make it
  into a /track-idea intake — captures the whole batch at once with dedup and origin discipline preserved.
