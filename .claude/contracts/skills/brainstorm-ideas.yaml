duplication_risk:
- with: track-idea
  relation: sibling-different-layer
  disambiguator: 'brainstorm-ideas generates a BATCH of N candidate intakes; track-idea captures a SINGLE
    record (''not_for: Capturing a single idea (use /track-idea intake — one record)'').'
- with: extract-existing-ideas
  relation: sequential
  disambiguator: extract-existing-ideas walks EXISTING prose (BACKLOG/lessons/plans) and hands its candidates
    to brainstorm-ideas' helper for the actual write; brainstorm-ideas generates NEW ideas from a topic.
    The write path is shared (dedup/validation live once).
- with: design-it-twice
  relation: sibling-different-layer
  disambiguator: 'brainstorm-ideas captures adjacent thoughts; design-it-twice compares implementation
    forks (''not_for: Brainstorming code structure / architecture forks (use /design-it-twice)'').'
