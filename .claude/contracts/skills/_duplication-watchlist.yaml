  - pair:
    - find-standard-gaps
    - harvest-learnings
    note: '[find-standard-gaps->harvest-learnings] harvest-learnings PROPOSES portable standards; find-standard-gaps
      gives an adopted standard an executable detector and COVERAGE-CHECKS it. harvest-learnings not_for:
      ''Coverage-checking a standard that already exists (use /find-standard-gaps).'' find-standard-gaps
      consumes the standard harvest produced. | [harvest-learnings->find-standard-gaps] harvest-learnings
      PROPOSES portable standards with exemplars + verdicts; find-standard-gaps gives an ADOPTED standard
      an executable detector and coverage-checks it. harvest-learnings escalate_to: ''/find-standard-gaps
      to give an adopted standard an executable detector.'''
  - pair:
    - find-standard-gaps
    - orient
    note: '[find-standard-gaps->orient] orient WRITES the lifecycle state (.project-state.json) that gates
      which standard rungs are active; find-standard-gaps is the coverage scan that those rungs feed into.
      orient not_for: ''Running the coverage scan that consumes this state (use /find-standard-gaps).''
      | [orient->find-standard-gaps] orient WRITES the lifecycle state; find-standard-gaps is the coverage
      scan that CONSUMES it to gate which standard rungs apply. orient not_for: ''Running the coverage
      scan that consumes this state (use /find-standard-gaps).'''
  - pair:
    - find-workflow-duplication
    - map-product-workflow
    note: '[map-product-workflow->find-workflow-duplication] map-product-workflow produces the workflow
      map (MAP); find-workflow-duplication consumes that surface to detect duplicated step authority (SUSPECT).
      MAP → SUSPECT bridge.'
  - pair:
    - fix-workflow
    - introduce-fk
    note: '[introduce-fk->fix-workflow] introduce-fk PROPOSES (read-only, proposal.md only); /fix-workflow
      or /refactor-subsystem EXECUTES. not_for: ''Refactor execution (use /fix-workflow or /refactor-subsystem
      after the proposal).'''
  - pair:
    - fix-workflow
    - prevent-regression
    note: '[prevent-regression->fix-workflow] fix-workflow CLOSES a bug (the fix itself); prevent-regression
      GUARDS it afterward (authors the lint/test/hook that rejects the regression). fix → prevent is the
      canonical close→guard ordering.'
  - pair:
    - harvest-learnings
    - plan-skill
    note: '[harvest-learnings->plan-skill] harvest-learnings proposes a standard; when one warrants its
      own detector skill, plan-skill designs it. harvest-learnings escalate_to: ''/plan-skill when a harvested
      standard warrants its own detector skill.'''
  - pair:
    - impact-feature
    - scope-feature
    note: '[impact-feature->scope-feature] scope-feature (stage 1) fills §1-2 and advances to scoped;
      impact-feature (stage 2) consumes a scoped plan and fills §3-4. delegate_from: ''/scope-feature
      recommends /impact-feature once §1-2 are filled.'' | [scope-feature->impact-feature] scope-feature
      fills plan §1-2 (status scoped); impact-feature is stage 2 reading a `scoped` plan and filling §3-4.
      Sequential chain stages, not overlap.'
  - pair:
    - map-subsystem
    - refactor-subsystem
    note: '[map-subsystem->refactor-subsystem] map-subsystem is read-only inventory feeding the loop;
      refactor-subsystem executes a spec-driven refactor. map-subsystem not_for: ''Refactor execution
      (use /refactor-subsystem with a spec).'''
  - pair:
    - plan-skill
    - prevent-regression
    note: '[plan-skill->prevent-regression] plan-skill `escalate_to`: /prevent-regression when a deterministic
      guard should enforce the skill contract. plan-skill designs the skill; prevent-regression hardens
      an invariant into a lint/test. Sequential.'
  - pair:
    - plan-spec
    - refactor-subsystem
    note: '[plan-spec->refactor-subsystem] plan-spec scaffolds the spec; refactor-subsystem executes it.
      plan-spec is terminal in the planning chain; refactor-subsystem is the execution handoff.'
  - pair:
    - project-interview
    - triage-debt
    note: '[project-interview->triage-debt] project-interview names known-bad current patterns; triage-debt
      is where cleanup of them is scored/queued. project-interview not_for: ''Cleanup execution (use /triage-debt,
      /fix-workflow, /refactor-subsystem).'''
  - pair:
    - project-interview
    - which-shape
    note: '[which-shape->project-interview] which-shape routes missing-intent situations TO project-interview;
      it does not capture intent itself. which-shape not_for: ''Replacing human judgment about project
      goals; missing intent should route to /project-interview.'''
  - pair:
    - propose-boundary
    - refactor-subsystem
    note: '[propose-boundary->refactor-subsystem] propose-boundary is read-only and stops at the proposal;
      refactor-subsystem (decomposition mode) executes it. | [refactor-subsystem->propose-boundary] propose-boundary
      / propose-folder-reorganization produce the proposal/spec; refactor-subsystem EXECUTES it in decomposition
      mode. The proposals never edit code; refactor-subsystem does.'
  - pair:
    - query-patterns
    - track-idea
    note: '[query-patterns->track-idea] query-patterns `escalate_to`: /track-idea intake when the query
      returns no matches and the problem is worth capturing. Read (search) then, on a miss, write (capture).
      No overlap.'
