  .claude/contracts/skills/_synth_watchlist.py). Raw, pre-review duplication candidates; promote confirmed
  items to .claude/quality/findings.jsonl. genuine-overlap + shared-doc-coupling are actionable; sibling-different-layer
  + sequential are expected/healthy (distinct surfaces / pipelines, disambiguated by each skill''s not_for).
  relation_disagreement = the two skills'' contracts classify the pair differently — reconcile.'
