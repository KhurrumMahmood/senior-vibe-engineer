schema_version: 2

skill: find-rule-surface-drift
job: suspect
problem_class: "agent-rules-surface drift detection (SUSPECT)"
intent: >
  Detect drift on the agent-rules surface (CLAUDE.md + .claude/docs/) against
  ADR 0005's tiered-storage convention: oversized always-loaded files, dormant
  load-on-demand docs, missing-but-referenced docs, unreferenced docs, and
  broken links from the human onboarding entry point (/ONBOARDING.md). A
  detector emits bands; thresholds tunable via --max-root-chars /
  --max-doc-chars. The audited artifact graph is host-language neutral; Python
  is only the installed implementation.
solves: >
  The agent-rules surface silently rotting — the always-on CLAUDE.md bloats,
  load-on-demand docs go stale or get referenced after deletion, and the
  trigger table drifts from the filesystem, eroding the tiered-storage
  discipline that keeps context lean.
