schema_version: 2

skill: scope-feature
job: plan
problem_class: "System-tier planning, stage 1 (PLAN)"
intent: >
  First skill in the System-tier chain. Scaffolds an ai-docs/plans/<name>.md plan if needed,
  reads decisions / canonical-patterns / smells, then drives clarifying questions to fill §1
  (Scope & Bounds) and §2 (Success Criteria). Advances plan status to `scoped`. Built for
  System-tier work where the judgment pause between scoping and impact analysis is the whole
  point.
solves: >
  New subsystems / cross-workflow features get implemented without ever pinning scope and
  success criteria, so impact analysis chases a moving target. This forces the scoping pause
  to happen first, as an explicit plan artifact with a status gate.
