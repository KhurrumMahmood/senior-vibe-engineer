# Intent reviewed against the current SKILL.md frontmatter on 2026-07-16.
schema_version: 2

skill: triage-debt
job: triage
problem_class: "cross-cutting debt aggregation (TRIAGE)"
intent: >
  Cross-cutting aggregator that scores accumulated debt across the maintenance
  loop's outputs (reviewed quality findings, find-* report stacks, spec drift,
  decision drift, hard-size-overflow specs, recurring same-target hits) and
  produces a ranked queue. Each entry names the recommended next skill to invoke
  (refactor-subsystem / fix-workflow / extract-* / decide). Pure read — never
  runs find-*; reads the cached evidence those skills already produced.
solves: >
  Individual find-* skills each see one axis; nobody sees what is ACCUMULATING
  across runs — recurrence, spec drift (IM-N unchecked >60d), decision drift
  (proposed >30d, broken chains). triage-debt answers "where is a maintenance
  window best spent" rather than "which one cleanup to do next".
