schema_version: 2

skill: move-path
job: refactor
problem_class: "deterministic filesystem path move / reference rewrite (REFACTOR)"
intent: >
  Plan, dry-run, apply, and verify standalone TypeScript/TSX file or directory
  moves with a virtual after-tree, identity-resolved
  Markdown/HTML/config/backtick/exact-path reference rewrites, Git-aware moves,
  explicit uncertainty buckets, and operational residue audits. The installed
  v1 guarantees stdlib JSON plans and reports source imports as unresolved
  risk; it never claims import-safe rewriting.
solves: >
  Everyday path moves are deceptively high blast: ad-hoc mv plus search/replace
  misses relative links, absolute spellings, Windows spellings, Git rename
  behavior, stale residues, and path values embedded in manifests or scripts.
  This skill keeps the mechanical portion deterministic and leaves only
  ambiguous residues for review.
