schema_version: 2

skill: find-doc-route-drift
job: suspect
problem_class: "doc-vs-route contract drift / product-topology (SUSPECT)"
intent: >
  Compare documented product routes and redirect claims against Django URL
  patterns and simple redirect calls. Flags unknown_documented_route (docs name a
  route no URL pattern provides), stale_redirect_claim (docs claim a redirect
  target differing from the view), and unverified_redirect_claim (docs claim a
  redirect the scanner can't prove).
solves: >
  Docs describing routes/redirects that code no longer registers — stale topology
  prose that misleads readers after a route module is refactored or a redirect is
  removed.
