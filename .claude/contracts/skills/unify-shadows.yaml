# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: unify-shadows
job: explain
problem_class: semantic-duplication resolution proposal (EXPLAIN/bridge)
intent: Turn a confirmed /find-semantic-duplication finding into an implementation-ready proposal. Consumes
  a finding shaped as keep_separate_document_why | share_utilities | complete_migration | merge_at_workflow
  and emits a proposal with migration plan, caller impact, test matrix, and stop condition. Hands off
  to /fix-workflow semantic:<id>.
solves: A detected semantic duplicate (two independently-written, both-live workflows solving the same
  problem) is not directly actionable — someone has to decide the merge shape and map caller impact before
  any code moves. This skill is the EXPLAIN-to-REFACTOR bridge for that decision.
