# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: unify-shadows
job: explain
problem_class: semantic-duplication resolution proposal (EXPLAIN/bridge)
intent: Turn one confirmed /find-semantic-duplication finding into an evidence-cited, read-only proposal.
  Python retains its profile-scout path. TypeScript consumes the accepted structured function finding,
  validates it before synthesis, applies one honest template for keep_separate_document_why | share_utilities
  | complete_migration | merge_at_workflow, and emits proposal/evidence/scope artifacts with source/caller
  impact, native test matrix, stop condition, human approval, and /fix-workflow semantic:<id> handoff.
solves: A confirmed semantic duplicate is still only advisory evidence. Before source changes, a human needs
  one bounded proposal that respects the upstream shape, cites current members and capability facts, exposes
  incomplete caller evidence, and states exactly what verification and approval gate the downstream change.
