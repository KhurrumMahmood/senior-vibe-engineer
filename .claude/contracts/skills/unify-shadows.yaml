duplication_risk:
- with: find-semantic-duplication
  relation: sequential
  disambiguator: 'unify-shadows `not_for`: ''Detection of semantic duplication (use /find-semantic-duplication)''
    — find-* detects, unify-shadows proposes the resolution, fix-workflow executes. No overlap.'
- with: find-duplication
  relation: sibling-different-layer
  disambiguator: 'unify-shadows `not_for`: ''Lexical near-clones (use /find-duplication then /fix-workflow)''.
    unify-shadows resolves SEMANTIC duplication (two shadows of one capability, different code); find-duplication
    detects lexical/structural clones (identical bodies).'
- with: propose-boundary
  relation: sibling-different-layer
  disambiguator: Both are EXPLAIN-job proposal-writers feeding /fix-workflow or /refactor-subsystem, but
    unify-shadows resolves SEMANTIC duplication (two shadows of one capability) while propose-boundary
    resolves a MISSING-BOUNDARY (one file, tangled domains).
