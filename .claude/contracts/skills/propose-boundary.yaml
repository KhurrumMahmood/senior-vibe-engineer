schema_version: 2

skill: propose-boundary
job: explain
problem_class: "missing-boundary resolution proposal (EXPLAIN/bridge)"
intent: >
  Turn a confirmed or suspected missing-boundary into a read-only
  boundary-extraction proposal. Consumes a target (file, directory, or skill
  directory) and emits a proposal with candidate seams, proposed public API,
  backward-compat shim shape, caller-impact summary, and characterization-test
  matrix. Read-only. Hands off to /refactor-subsystem (decomposition mode).
solves: >
  A file or directory where distinct domain concerns live side-by-side with no
  defined public contract — siblings reach into each other's private helpers,
  change-amplification touches the same N files per feature, test setup explodes
  — needs a seam proposal before any refactor.
