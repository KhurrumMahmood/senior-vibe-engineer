schema_version: 2

skill: find-skill-artifact-drift
job: suspect
problem_class: "instruction-artifact coherence detection (SUSPECT)"
intent: "SUSPECT scan for instruction-artifact coherence: a SKILL.md or evidence contract that promises scripts, flags, tools, or evidence must have the corresponding executable artifact. Band A is deterministic reference integrity and gate-worthy; Band B remains heuristic and advisory."
solves: "scripts/skill_meta.py lint validates the frontmatter CONTRACT (required fields, enum values, name==dir) but does NOT check the references between the SKILL.md body and the files on disk. Refactors rename or delete scripts the prose still names, drop documented flags, or add a shell block without the Bash grant — drift that passes the frontmatter lint yet breaks the skill at runtime."
born:
  commit: "331f2d5"
  date: "2026-05-22"
  sibling_births: []
dogfood_kind: fixture-pair
dogfooded_on:
  - "ships a good/bad fixture-skill pair that smoke.py asserts on: every band must fire on the bad fixture, the good fixture stays clean, and --gate exits non-zero on the bad fixture and zero on the good one (the regression oracle)"
  - "no timestamped self-scan run on disk (reports_dir is null, run count 0) — the fixtures pair is the dogfood, not a reports/ scan"
reports_dir: null
run_evidence:
