    relation: sibling-different-layer
    disambiguator: "SKILL-META TRIO layer split: find-skill-artifact-drift checks the SKILL.md PROSE references (named scripts, documented --flags, declared tools/produces/evidence) against the FILES ON DISK; find-skill-intent-drift checks the recorded INTENT/PROVENANCE contract (this contracts/skills/<skill>.yaml) against the skill. Different layers of skill-meta drift, NOT genuine overlap."
  - with: plan-skill
    relation: sequential
    disambiguator: "find-skill-artifact-drift detects Band-A/B reference drift; Band-C semantic judgment ('is the procedure correct?') is out of scope and handed to plan-skill. find-skill-artifact-drift not_for: 'Proving a skill's procedure is semantically correct … Band C semantic judgment belongs to /plan-skill.'"
provenance_confidence:
