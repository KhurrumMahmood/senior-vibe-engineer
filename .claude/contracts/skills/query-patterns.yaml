duplication_risk:
- with: teach-pattern
  relation: sibling-different-layer
  disambiguator: query-patterns SEARCHES the Tier-2 pattern library (.claude/patterns/) for a problem-shape
    match and ranks; teach-pattern EXPLAINS an already-known convention from canonical-patterns/smells/ADRs
    into a layered briefing. Search vs teach; different source corpus.
- with: track-idea
  relation: sequential
  disambiguator: 'query-patterns `escalate_to`: /track-idea intake when the query returns no matches and
    the problem is worth capturing. Read (search) then, on a miss, write (capture). No overlap.'
- with: find-orphaned-ideas
  relation: sibling-different-layer
  disambiguator: 'query-patterns `not_for`: ''Finding orphaned ledger entries (use /find-orphaned-ideas)''.
    query-patterns matches a PROBLEM to Tier-2 patterns; find-orphaned-ideas audits Tier-1 ledger entries
    needing attention. Different tier, different question.'
