# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: query-patterns
job: meta
problem_class: pattern-library prior-art search (META, Tier 2)
intent: Search the Tier 2 pattern library at .claude/patterns/ for prior art matching a problem description.
  Reads every pattern file's frontmatter (problem_class, pros, cons, domain, status, generalizability)
  plus the body's 'Problem fit' / 'Use this when X' headline, scores by token overlap, and returns ranked
  matches. Read-only, cheap, fast, no side effects.
solves: An agent or human about to start work re-invents a shape the project already has a recommended
  pattern for. query-patterns is the cheap 'does prior art exist?' check at planning time (/plan-feature,
  /scope-feature, /architecture-fit) and during exploratory work.
