intent: "Surface concept-name drift between the canonical glossary at `.claude/contracts/concepts.yaml` and the codebase/docs via three strict bands — avoid_term_hit (code uses a phrasing the glossary's `avoid:` block bans), competing_term_coexistence (multiple `competing_terms` from a flagged_ambiguities entry in one file), and superseded_co_occurrence (a deprecated name and its `superseded_by:` replacement in one file). Detection only — never edits code or docs."
