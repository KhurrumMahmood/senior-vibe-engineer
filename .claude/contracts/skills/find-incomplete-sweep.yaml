schema_version: 2

skill: find-incomplete-sweep
job: suspect
problem_class: "incomplete-execution-residue detection (SUSPECT) — forgotten sibling at the old shape"
intent: >
  Advisory scan for incomplete sweeps — a multi-site change applied to N-1 of N
  structurally-similar sites, leaving one sibling frozen at the old shape, fully
  referenced and fully live so nothing else flags it. Python v0 is kwarg-omission:
  among a callee's call sites, a keyword the strong majority pass but one
  straggler does not, gated on a git-trajectory signal (the kwarg-present sites
  were touched AFTER the straggler — a sweep that landed after the straggler was
  last edited). Deterministic pre-filters (query-lookup callees, optional-by-
  nature kwargs, arg-count-illegal kwargs, dataclass-/signature-default fields)
  keep the scout's residual real-straggler-dense; the forgotten-vs-deliberate
  call is an irreducible scout fan-out. TypeScript/TSX v1 groups resolved project
  calls by object-option property presence with the host-pinned Compiler API and
  preserves the same trajectory and explicit-verdict boundary. A second,
  experimental Python placeholder-residue
  band (--band placeholder) catches concrete scaffolded-but-unfilled functions
  gated by recency + reference-asymmetry. Hands off to /fix-workflow.
solves: >
  The most characteristic residue of AI partial execution: a session sweeps a
  change across call sites and runs out of context before the last one. The
  straggler still works and is still referenced, so a lint (no declared contract
  names the missing site) and /find-dormant (which only sees the unreferenced
  half) are both blind to it. The intended shape is inferred from the cluster
  majority + git recency — judgment-bearing and per-run, not a fixed AST rule.
