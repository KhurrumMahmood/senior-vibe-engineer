schema_version: 2

skill: organize-project-structure
job: plan
problem_class: "repo-wide project information architecture under constraints (PLAN)"
intent: >
  Arrive at an ideal or near-ideal folder topology by summarizing folder value,
  abstracting lifecycle boundaries, applying framework/tool/human constraints,
  classifying confusing names by context, and separating deterministic move
  plans from judgment-based follow-up.
solves: >
  Repos that accrete historical inputs, outputs, partial KBs, specs, evals, and
  source dumps become hard to navigate. Without a planning skill, agents either
  preserve confusing chronology at the top level, keep meaningless operational
  labels without naming context, or perform broad unstructured moves with unsafe
  reference rewrites.
