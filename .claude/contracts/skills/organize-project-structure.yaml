  first: null
  latest: null
embodies_decisions:
  adr: []
  precedent: []
  doc: [skill-catalog.md, README.md, quality-coordination-kernel.md]
  contract: []
related_skills: [move-path, find-folder-topology-drift, propose-folder-reorganization, rename-concept, refactor-subsystem]
duplication_risk:
  - with: move-path
    relation: sequential
    disambiguator: "organize-project-structure decides the topology and move batch; move-path applies the deterministic path/reference portion after dry-run review."
  - with: propose-folder-reorganization
    relation: sibling-different-layer
    disambiguator: "organize-project-structure is repo-wide lifecycle/information architecture; propose-folder-reorganization is a read-only per-prefix Python cluster proposal after find-folder-topology-drift."
  - with: rename-concept
    relation: sibling-different-layer
    disambiguator: "organize-project-structure may rename confusing files/folders as topology, but glossary/domain terminology rename completion routes to rename-concept."
