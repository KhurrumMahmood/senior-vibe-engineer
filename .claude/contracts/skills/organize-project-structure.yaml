  textual: high
  structural: med
  temporal: high
  dogfood: med
evidence:
  - "c08e6dc — skill born and wired into README, skill catalog, which-shape, and move-path guidance."
  - "95017ff — reframed as planning-first rather than direct execution."
  - "Fable reorg exposed durable lessons: preserve provenance labels only when they are context, rename meaningless operational labels by default, keep generated reports under .engineering/local, and run operational path residue checks beyond Markdown links."
  - "Fable stale-manifest miss reinforced the micro-tool loop: when a repeatable cleanup risk is concrete, add a deterministic helper to the owning skill with assumptions, output, and tests."
gaps:
  - "No dedicated helper script; correctness depends on human/LLM summaries plus move-path dry-run/check and project-native validation."
  - "Needs continued dogfood on repos with framework constraints such as Next.js, Django, Python packages, and mixed runtime/apps layouts."
