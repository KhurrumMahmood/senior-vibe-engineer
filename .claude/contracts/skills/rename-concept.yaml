related_skills: [find-concept-divergence, find-incomplete-sweep, decide, refactor-subsystem, which-cleanup]
duplication_risk:
  - with: find-concept-divergence
    relation: sequential
    disambiguator: "rename-concept not_for quote: 'Bulk drift detection across ALL concepts at once (use /find-concept-divergence directly — this skill filters it to ONE rename).' The completeness gate (definition of done) IS /find-concept-divergence's superseded_co_occurrence + avoid_term_hit bands filtered to this rename — this skill CONSUMES that detector (runs it once, both bands filter the findings), it does not duplicate it. Also a delegate_from edge: a divergence finding routes here for a per-rename completeness check."
  - with: find-incomplete-sweep
    relation: sibling-different-layer
    disambiguator: "Paired in SKILL.md: /rename-concept ASSESSES whether one named rename is done (subsystem granularity, REFACTOR, glossary-backed completeness gate); /find-incomplete-sweep CATCHES a half-done multi-site sweep after the fact (code granularity, advisory SUSPECT, git-trajectory heuristic). Same failure (partial execution), two altitudes, two postures."
  - with: refactor-subsystem
    relation: sibling-different-layer
    disambiguator: "rename-concept not_for quote: 'General module decomposition or service extraction (use /refactor-subsystem).' refactor-subsystem is spec-first structural module moves with scout fan-out; rename-concept is a wide-but-shallow identifier+string+doc+mirror rename governed by a glossary. escalate_to refactor-subsystem only if the rename needs structural moves beyond identifier/string renames."
  - with: decide
    relation: sequential
    disambiguator: "rename-concept not_for quote: 'Authoring the DECISION itself — the ADR content is human judgment; this skill reports lifecycle status, it does not decide.' The lifecycle's decision step escalates to /decide for the ADR content; rename-concept reports on the decision, it does not author it."
