schema_version: 2

skill: rename-concept
job: refactor
problem_class: "domain-concept rename lifecycle assessment + completeness gate (REFACTOR) — no front door, no per-rename definition of done"
intent: >
  Assess a single domain-concept rename (OLD -> NEW) against its full lifecycle
  and a mandatory two-band completeness gate, read-only. v0 is ASSESS-ONLY:
  assess.py reports the scope-gate verdict (glossary concept and/or wide-blast,
  or a trivial local rename to bail on), a per-step lifecycle status table
  (concepts.yaml superseded_by, a no_<old>_references guard lint, live-code
  blast radius with allowlisted residue excluded), and the completeness gate —
  /find-concept-divergence's superseded_co_occurrence (band 3, identifiers) AND
  avoid_term_hit (band 1, retired prose) filtered to THIS rename, both of which
  must be CLEAN. The gate is the definition of done: a coverage_lint-guarded
  rename cannot pass on identifiers alone while comments/docstrings still use
  the old term (band 3 is skipped for coverage_lint concepts; band 1 is what
  proves the prose was corrected). It DRIVES /find-concept-divergence (one scan,
  both bands filter it); it does not reimplement the detector.
solves: >
  A concept rename is a multi-step lifecycle executed from tribal knowledge with
  no front door and no completeness gate, so renames predictably land
  half-applied: the identifier sweep happens and the long tail (string-literal
  references, the guard lint, the cross-tool agent mirrors, the docs) is
  forgotten — and the retired *prose* is forgotten even when identifiers are
  clean. This skill frames /find-concept-divergence's drift bands as a
  per-rename definition of done, so "is this rename actually finished?" has a
  read-only answer instead of being eyeballed.
born:
  commit: "uncommitted"
  date: "2026-06-08"
  sibling_births: []
dogfood_kind: fixture-pair
dogfooded_on:
  - "Self-run against the ES2 tree (2026-06-08): assess.py drives this repo's real find-concept-divergence over its portable DEFAULT_TARGETS. On `ledger -> findings-log` (a real glossary concept, 63 live files) BOTH bands render GREEN — band 3 superseded_co_occurrence empty (no ES2 concept declares superseded_by) and band 1 avoid_term_hit empty (tree is clean against its own glossary). Verdict HALF-APPLIED only because the synthetic NEW slug is not in the glossary and no guard lint exists, which is the honest read."
  - "Two-band gate proven non-no-op (2026-06-08): scripts/smoke.py injects a transient probe file under tests/ containing a glossary `avoid:` phrase verbatim ('confusing skill with the underlying tool', owned by the `skill` concept), runs assess.py with old=skill, and asserts band 1 flips RED while band 3 stays GREEN and the verdict leaves COMPLETE — then removes the probe (no leak). This is the headline novelty (avoid_term_hit prose gate) exercised end-to-end against ES2's scanner; the clean-tree run is the good fixture, the probe-injected run is the bad fixture."
