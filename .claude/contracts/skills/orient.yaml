# Skill intent + provenance contract — schema v2.
# ES2-only skill; authored fresh from SKILL.md + es2_skill_facts.yaml.

schema_version: 2

skill: orient
job: meta
problem_class: "lifecycle-state declaration / standard-activation gating (META)"
intent: "Establish or re-confirm a project's lifecycle state on two independent axes — maturity (prototype → first-users → production) and stakes/exposure (internal → external → public-adversarial) — by asking orientation questions, showing the resulting classification and which standard rungs it activates (and which it caps), then writing the declared state to .project-state.json at the project root. The human-in-the-loop 'pull' half of ADR 0020: inference proposes a transition; /orient lets the human dispose."
solves: "Stakes/exposure are NOT reliably inferable from code, so without a human-declared state the standard-activation ecosystem either under-defends (a prototype-grade control shipped into a relied-upon, exposed context) or over-defends (gold-plating a low-stakes internal tool). There was no single declared-state surface that activates the right rungs at the right moment AND caps the heavy ones on the way down."
