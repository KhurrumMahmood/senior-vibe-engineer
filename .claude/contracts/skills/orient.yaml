    disambiguator: "orient is the NARROW two-axis (maturity × stakes) state write; project-interview is the BROAD human-intent profile. orient not_for: 'Capturing project purpose, critical workflows, intentional tradeoffs … (use /project-interview).' project-interview owns purpose/risk-posture/do-not-break surfaces."
  - with: find-standard-gaps
    relation: sequential
    disambiguator: "orient WRITES the lifecycle state; find-standard-gaps is the coverage scan that CONSUMES it to gate which standard rungs apply. orient not_for: 'Running the coverage scan that consumes this state (use /find-standard-gaps).'"
  - with: adapt-project
    relation: sibling-different-layer
    disambiguator: "orient declares human-judgment lifecycle/stakes state; adapt-project discovers OBJECTIVE repo facts (stack, CI, source roots). orient not_for: 'Discovering objective repo facts like stack, CI, source roots (use /adapt-project).'"
