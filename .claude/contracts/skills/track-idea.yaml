schema_version: 2

skill: track-idea
job: meta
problem_class: "idea-ledger capture (META, Tier 1)"
intent: >
  Append an intake, event, or lesson record to the Tier 1 idea ledger at
  .claude/ideas/log.jsonl. The capture surface for everything that could be
  reused or forgotten — features, refactors, prompts, harnesses, research
  probes, workflow tweaks. Validates against the idea-ledger schema before
  writing, then projects the idea's current state (list / show).
solves: >
  Reusable thinking (a prompt that worked, a research probe, a harness shape, a
  UI idea) gets lost in chat transcripts and ad-hoc notes. track-idea is the
  durable, schema-validated capture point upstream of BACKLOG.md and the pattern
  library.
