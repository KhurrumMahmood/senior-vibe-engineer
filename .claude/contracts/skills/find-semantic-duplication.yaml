schema_version: 2

skill: find-semantic-duplication
job: suspect
problem_class: "semantic (behavioral) duplication detection (SUSPECT)"
intent: >
  Read-only scan that surfaces code which is BEHAVIORALLY equivalent without
  being textually identical — parallel implementations of the same logic that a
  token-diff clone detector misses — ranked as advisory leads, with a deliberate
  keep-separate verdict for legitimately-parallel code, without touching
  production files.
  Python retains the staged scout pipeline. TypeScript/TSX v1 narrows the
  claim to typed top-level functions with compatible resolved return shape,
  distinct token shape, no direct caller relationship, and compatible policy;
  final output preserves confirmed, uncertain, and rejected candidates plus a
  capability matrix rather than claiming safe consolidation.
solves: >
  Token-level clone detection (find-duplication) misses re-implementations that
  do the same thing with different syntax; there was no lead list of where the
  same behavior was reinvented, so semantic forks drifted apart and contradicted
  each other over time.
