schema_version: 2

skill: impact-feature
job: plan
problem_class: "System-tier planning (stage 2 of 4) — cross-subsystem impact mapping"
intent: "Second skill in the System-tier planning chain. Reads a scoped-status plan at ai-docs/plans/<name>.md, fans out one scout per touched subsystem to map call sites + model touchpoints + route boundaries + behaviors-to-preserve + test surfaces, synthesizes the cross-subsystem impact and blast radius, fills §3-4 of the plan, and advances status to impacted. Heavier than /scope-feature (scout fan-out) but lighter than /plan-feature (no spec scaffold; that's /plan-spec)."
solves: "A scoped feature whose true reachability is unknown — impact is not a touched-files list but the full set of call sites and load-bearing behaviors-to-preserve (save orderings, queue pinning, signal handlers) the change must not break. Scouts run in parallel so wall-clock cost scales with the most-touched subsystem, not the sum."
