duplication_risk:
  - with: architecture-fit
    relation: sequential
    disambiguator: "architecture-fit produces the `architected` plan (fills §5-6); plan-spec consumes it and promotes to a spec. not_for: 'Plan with status != architected (use the matching earlier-stage skill).' Sequential, gated by status."
  - with: refactor-subsystem
    relation: sequential
    disambiguator: "plan-spec scaffolds the spec; refactor-subsystem executes it. plan-spec is terminal in the planning chain; refactor-subsystem is the execution handoff."
  - with: plan-feature
    relation: sibling-different-layer
    disambiguator: "Both end at a spec, but plan-feature scaffolds a proposed Feature-tier spec from scratch; plan-spec PROMOTES an already-architected System-tier plan via scripts/plans.py promote. Entry condition differs."
