schema_version: 2

skill: plan-spec
job: plan
problem_class: "System-tier planning, terminal stage (PLAN)"
intent: >
  Final skill in the System-tier chain. Reads an `architected`-status plan, validates that
  §6 has no unresolved P0 forks, then calls scripts/plans.py promote to scaffold a successor
  spec under ai-docs/specs/<spec-id>.md and mark the plan `promoted`. The plan's §3-5 inform
  the spec's Architecture / Implementation / Exceptions sections. Hands off to
  /refactor-subsystem for execution.
solves: >
  A fully-architected plan still has to become a behavior-preserving spec that
  /refactor-subsystem can execute, with the plan<->spec link and the no-open-P0-fork gate
  enforced. plan-spec is the validated promotion step that closes planning and opens
  execution.
