gaps:
  - "embodies_decisions.adr is []: ADRs 0003 and 0017 name plan-spec only as a CONSUMER/transcriber in the planning chain (it promotes an architected plan to a spec), not as the enforcement/realization of either decision. The host-a base's adr:[\"0002\"] was a spec-first attribution that belongs to /refactor-subsystem (the executor), not to plan-spec, so it does not transfer. No precedent names this skill."
