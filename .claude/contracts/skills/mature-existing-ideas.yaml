schema_version: 2

skill: mature-existing-ideas
job: meta
problem_class: "idea-ledger research / freshness (META, Tier 1)"
intent: >
  Research an existing ledger entry (or a batch carrying the needs-research
  marker), append research-log notes to the ledger, and optionally clear markers
  as evidence accumulates. The orchestrator does the research (project doc grep,
  external Web/Context7 lookups, prior-art surveys); the helper script appends
  the note event(s) and marker transitions.
solves: >
  Captured ideas marked needs-research go stale without anyone doing the research
  and recording it. mature-existing-ideas is the structured "do the research now,
  write it down, decide whether to clear the marker" surface, plus periodic
  freshness review for untouched ideas.
