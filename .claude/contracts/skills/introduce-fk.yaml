schema_version: 2

skill: introduce-fk
job: explain
problem_class: "refactor proposal (EXPLAIN/bridge) — tuple-identity → ForeignKey"
intent: >
  Turn a tuple-inferred-identity pattern (.filter(status=X, created_at__gt=Y).first()) into
  an explicit ForeignKey + two-step data-migration proposal. Consumes an introduce-fk
  candidate from /find-implicit-state (or an explicit OWNER::Model -> TARGET::Model [via
  fk_name] target) and emits reports/introduce-fk/<target>/proposal.md with FK field shape,
  backfill migration sketch, caller migration table, tie-break strategy, and risks.
  Read-only — no code edits.
solves: >
  Owner/job identity inferred from a (status, timestamp, nullness) tuple, which breaks
  under concurrent jobs and hides in test fixtures. An explicit FK makes the at-most-one
  invariant schema-enforced; this skill produces the implementation-ready proposal to get
  there.
