# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: find-stale-artifacts
job: suspect
problem_class: working-artifact hygiene detection (SUSPECT)
intent: Detect stale working artifacts — abandoned plans, proposed plans untouched past a soft staleness
  budget, aged scan-* report directories not pointed at by `latest`, and orphan top-level reports/*.md
  files. Enforces a status-frontmatter + age + reference-graph discipline across a small fixed list of
  artifact dirs (ai-docs/plans, ai-docs/specs, reports/). The artifact lifecycle is independent of the
  host project's source language. Sibling to /find-dormant for non-code surfaces.
solves: Working artifacts that outlive the work and accumulate as a silent attention tax — months-old
  abandoned/proposed plans, dead scan dirs nobody will reread, and stray top-level report notes — with
  no periodic forcing function to clear them.
