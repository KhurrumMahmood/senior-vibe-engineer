evidence:
- 5400770 B1 portability proof — copied installed execution preserves the artifact-lifecycle report in a TypeScript host without source-language assumptions.
- 'scan-surface declared via scans: frontmatter [markdown] (2026-06-11 perimeter sweep, ADR 0032) — the scan surface is now part of the intent surface and audited by /find-perimeter-gaps'
- 90f8567 — born in the big-bang ecosystem-extraction commit alongside 54 sibling skills (temporal weak;
  textual weak — no commit names this skill in ES2's big-bang birth)
- has scripts/ (detector) but no fixtures dir — relies on the live artifact surface as its corpus (structural
  med)
- reports/find-stale-artifacts — 1 scan dir (scan-20260516-020146), one self-report on the ES2 tree (gitignored)
gaps:
- The host-a contract recorded dogfood_kind subsystem-refactor (the motivating in-commit cleanup WAS the
  dogfood); that is host-a history. ES2 has only one self-scan with no paired deletion, so ES2's honest
  dogfood_kind is none-found and dogfood confidence is med (a single self-run exists but is not an oracle).
- SKILL.md not_for references ADR 0005 (agent-rules-design) as a disambiguating boundary, but 0005 names
  find-rule-surface-drift as its scanner, not find-stale-artifacts, so embodies_decisions.adr stays []. No
  reports beyond the single scan to map usage.
