problem_class: "decision-record authoring (cross-cutting DECIDE)"
intent: "Author or amend a single Architectural Decision Record under ai-docs/decisions/. The smallest first-class artifact in the senior-engineer skill ecosystem, usable at any tier (Quick / Feature / System / Maintenance) whenever a real choice is being made. Reads canonical-patterns.md and architectural-smells.md to suggest related-pattern / related-smell backrefs and to avoid duplicating an existing decision. Read-only against the rest of the codebase — only writes under ai-docs/decisions/."
solves: "Design forks that constrain future work or exclude an alternative being decided implicitly (in chat, commits, or someone's head) instead of recorded as a navigable, supersedable ADR — and the registry becoming un-navigable without backrefs."
