schema_version: 2

skill: find-implicit-state
job: suspect
problem_class: "stringly-typed-state / tuple-identity detection (SUSPECT)"
intent: >
  Detect stringly-typed state comparisons and tuple-inferred identity patterns via
  an AST scan — bare string literals compared to `.status`/`.phase`/`.state`,
  model fields declared without a `TextChoices` enum, and
  `.filter(status=..., *_at__...).first()` identity-inference shapes. Collapses by
  file, fans out scout sub-agents to bucket each candidate, hands off to
  /extract-enum or /introduce-fk.
solves: >
  The stringly-typed-state smell — state encoded as bare strings instead of a
  TextChoices enum, and entity identity inferred from a (status, timestamp) tuple
  instead of an explicit FK — both of which make state transitions and joins
  fragile.
