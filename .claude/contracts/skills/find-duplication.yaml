duplication_risk:
- with: find-semantic-duplication
  relation: sibling-different-layer
  disambiguator: 'not_for quote: ''Semantic duplication where the code differs but the workflow overlaps
    (use /find-semantic-duplication)''. find-duplication = lexical/structural (identical bodies); semantic
    = same problem, different code.'
- with: find-frontend-duplication
  relation: sibling-different-layer
  disambiguator: find-duplication is Python-only (jscpd+AST on .py); find-frontend-duplication compares
    Tailwind class chains + JS helper forks in templates/static. Same family, different language surface.
- with: find-workflow-duplication
  relation: sibling-different-layer
  disambiguator: 'not_for quote: ''Cross-layer drift (template/JS/Python for one workflow — use /find-workflow-duplication)''.
    find-duplication is intra-language clone detection; workflow-duplication spans layers.'
- with: find-dormant
  relation: sibling-different-layer
  disambiguator: 'Co-born in the big-bang commit. find-duplication has a dormant-code side-channel but
    its primary axis is clones; find-dormant owns reachability/dead-code (''not_for: Dead-code detection
    as a primary task (that''s /find-dormant)'').'
