# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: find-duplication
job: suspect
problem_class: structural/lexical duplication detection (SUSPECT)
intent: Detect structural and lexical code duplication by running jscpd and an AST visitor in parallel,
  collapsing overlapping clone pairs into method-identity findings, fanning out sub-agent investigators,
  and producing a P0/P1/P2 triage report with a dormant-code side-channel. Hands off to /fix-workflow
  cluster:<id>.
solves: Copy-paste rot — two methods with identical/near-identical bodies — that accumulates in an AI-grown
  codebase, with the noise of raw jscpd/AST output collapsed into actionable method-identity clusters.
