schema_version: 2
skill: extract-enum
job: explain
problem_class: stringly-typed closed-vocabulary consolidation proposal (maintenance EXPLAIN/bridge)
intent: Turn a stringly-typed closed vocabulary into a wire-compatible enum proposal. Consume a confirmed
  candidate or explicit `<file>::<field>` target, preserve every persisted and external value, classify
  callers and risks, and stop before implementation. Framework bindings may render the final proposal,
  while the canonical procedure remains language- and framework-neutral.
solves: Repeated literal states drift across callers when no named closed-vocabulary type owns them. The
  proposal makes members, wire values, call-site migrations, compatibility risks, and stop conditions
  explicit without changing production code.
