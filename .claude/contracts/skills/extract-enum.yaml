    finding into a TextChoices proposal (''not_for: Detection (use /find-implicit-state first)''). Co-born
    in the big-bang commit.'
- with: introduce-fk
  relation: sibling-different-layer
  disambiguator: 'extract-enum handles the stringly-typed-field sub-shape; introduce-fk handles the tuple-inferred-identity
    sub-shape `.filter(status=X, *_at__...).first()` (''not_for: Tuple-inferred-identity sub-shape ...
    (use /introduce-fk)''). Both consume find-implicit-state output.'
- with: extract-state-type
  relation: sibling-different-layer
  disambiguator: extract-enum is for a Django MODEL FIELD's status; extract-state-type is for a function's
    implicit mutable dict/kwargs state. Both are EXPLAIN-job proposers, different target shape.
