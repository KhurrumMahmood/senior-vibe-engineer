# Skill intent + provenance contract — schema v2 (engineering-skills-2).
schema_version: 2
skill: extract-enum
job: explain
problem_class: stringly-typed-state consolidation proposal (maintenance EXPLAIN/bridge)
intent: Turn a stringly-typed state field into a TextChoices enum proposal. Consumes an extract-enum candidate
  from /find-implicit-state (or an explicit `<file>::<field>` target) and emits reports/extract-enum/<target>/proposal.md
  with the enum class, caller migration table, data-migration risks, and stop condition. Read-only — no
  code edits. Hands off to /fix-workflow or /refactor-subsystem.
solves: A model status/phase/state field carried as bare strings compared across the codebase, with no
  TextChoices enum — bridges a detected implicit-state finding into a concrete enum + caller-migration
  + data-migration plan.
