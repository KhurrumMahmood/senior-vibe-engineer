schema_version: 1
contract_version: 1

schemas:
  skill_contract:
    version: 1
    required: [capability_contract, language, framework, layer, binding, support, capabilities, capability_evidence, support_evidence]
    fields:
      language: language-id
      framework: framework-id
      layer: layer-id
      binding: binding-id
      bindings: [binding-id]
      scans: [scan-target-id]
      capabilities: [capability-id]
      portable_subjects: [language-id]
      capability_evidence: subject-to-hashed-file-attestations
      support: support-state-id
      support_evidence: deterministic-evidence-envelope
      scan_implementations: scan-target-to-hashed-script-attestation
  stack_profile:
    version: 2
    required: [project_roots, languages, frameworks, tools]
    fields:
      project_roots: [project-root]
      languages: [language-id]
      frameworks: [framework-id]
      tools: [tool-id]
  completion_claim:
    version: 1
    fields:
      stack: stack-id
      capabilities: capability-to-bound-evidence-claim
      agent_surfaces: agent-surface-to-versioned-bound-evidence-claim
  finding_identity:
    version: 2
    hash_fields: [schema, provider, rule, language, path, semantic_anchor, occurrence]
    volatile_fields: [line, column, severity, metrics, message, tool_version]

runtime:
  language: python
  version: ">=3.11"
  dependency_file: requirements.txt

evidence_tools:
  python-runtime:
    version_pattern: '^Python 3\.(?:11|12|13|14)\.'
    argv_tail: [--version]
    executable: current-python
  node-runtime:
    version_pattern: '^v(?:20|22)\.'
    argv_tail: [--version]
    executable: [node]
  tree-sitter:
    version_pattern: '^0\.26\.0$'
    argv_tail: [-c, "import importlib.metadata; print(importlib.metadata.version('tree-sitter'))"]
    executable: current-python
  tree-sitter-language-pack:
    version_pattern: '^1\.12\.5$'
    argv_tail: [-c, "import importlib.metadata; print(importlib.metadata.version('tree-sitter-language-pack'))"]
    executable: current-python
  ast-grep:
    version_pattern: '^ast-grep 0\.44\.1$'
    argv_tail: [--version]
    executable: [ast-grep, sg]
  typescript-compiler-api:
    version_pattern: '^Version 5\.9\.3$'
    argv_tail: [--version]
    executable: [tsc]
  typescript-native-compiler:
    version_pattern: '^Version 7\.0\.2$'
    argv_tail: [--version]
    executable: [tsc]

languages:
  any:
    subject: false
    binding_required: false
    extensions: []
    project_markers: []
  python:
    subject: true
    binding_required: true
    installation_subject: true
    extensions: [.py, .pyi]
    project_markers: [pyproject.toml, requirements.txt, manage.py]
  javascript:
    subject: true
    binding_required: true
    installation_subject: true
    extensions: [.js, .mjs, .cjs, .jsx]
    project_markers: [package.json]
  typescript:
    subject: true
    binding_required: true
    installation_subject: true
    extensions: [.ts, .tsx, .mts, .cts]
    project_markers: [tsconfig.json]
  rust:
    subject: true
    binding_required: true
    installation_subject: true
    extensions: [.rs]
    project_markers: [Cargo.toml]
  go:
    subject: true
    binding_required: true
    installation_subject: true
    extensions: [.go]
    project_markers: [go.mod]
  templates:
    subject: true
    binding_required: false
    extensions: [.html, .htm, .jinja, .j2]
    project_markers: []
  css:
    subject: true
    binding_required: false
    extensions: [.css, .scss]
    project_markers: []
  shell:
    subject: true
    binding_required: false
    extensions: [.sh, .bash]
    project_markers: []
  markdown:
    subject: true
    binding_required: false
    extensions: [.md, .mdx]
    project_markers: []
  java:
    subject: true
    binding_required: true
    extensions: [.java]
    project_markers: [pom.xml]
  kotlin:
    subject: true
    binding_required: true
    extensions: [.kt, .kts]
    project_markers: []
  ruby:
    subject: true
    binding_required: true
    extensions: [.rb]
    project_markers: [Gemfile]
  php:
    subject: true
    binding_required: true
    extensions: [.php]
    project_markers: [composer.json]
  sql:
    subject: true
    binding_required: true
    extensions: [.sql]
    project_markers: []

frameworks:
  any:
    languages: [any]
    package_tokens: []
    file_markers: []
    core_leakage_terms: []
  none:
    languages: [any]
    package_tokens: []
    file_markers: []
    core_leakage_terms: []
  django:
    languages: [python]
    package_tokens: [django]
    file_markers: [manage.py]
    core_leakage_terms: [django, celery]
  react:
    languages: [javascript, typescript]
    package_tokens: [react, "@types/react", react-router]
    file_markers: []
    core_leakage_terms: [react]

tools:
  pip:
    roles: [package-manager]
    file_markers: [requirements.txt, pyproject.toml]
    package_tokens: []
  npm:
    roles: [package-manager]
    file_markers: [package-lock.json]
    package_tokens: []
    run_script_command: npm run
    fallback_for: package.json
  pnpm:
    roles: [package-manager]
    file_markers: [pnpm-lock.yaml]
    package_tokens: []
    run_script_command: pnpm
  yarn:
    roles: [package-manager]
    file_markers: [yarn.lock]
    package_tokens: []
    run_script_command: yarn
  pytest:
    roles: [test]
    file_markers: []
    package_tokens: [pytest]
  ruff:
    roles: [lint]
    file_markers: []
    package_tokens: [ruff]
  vite:
    roles: [build, dev-server]
    file_markers: [vite.config.js, vite.config.ts]
    package_tokens: [vite]
  vitest:
    roles: [test]
    file_markers: []
    package_tokens: [vitest]
  eslint:
    roles: [lint]
    file_markers: [eslint.config.js, eslint.config.mjs]
    package_tokens: [eslint]
  typescript-compiler:
    roles: [build, typecheck, analysis]
    file_markers: [tsconfig.json]
    package_tokens: [typescript]
  cargo:
    roles: [package-manager, build, test]
    file_markers: [Cargo.toml]
    package_tokens: []
  rustc:
    roles: [compiler, analysis]
    file_markers: [Cargo.toml]
    package_tokens: []
  go-toolchain:
    roles: [package-manager, build, test, analysis]
    file_markers: [go.mod]
    package_tokens: []

project_root:
  identity: canonical-realpath
  multi_root: true
  root_markers: [pyproject.toml, requirements.txt, package.json, tsconfig.json, Cargo.toml, go.mod]

layers:
  core:
    binding_kinds: [none]
  language:
    binding_kinds: [language]
  framework:
    binding_kinds: [framework]
  domain:
    binding_kinds: [domain]
  host-overlay:
    binding_kinds: [host]

bindings:
  core:
    kind: none
    layer: core
    languages: [any]
    frameworks: [any, none]
  python:
    kind: language
    layer: language
    languages: [python]
    frameworks: [any, none]
  javascript-typescript:
    kind: language
    layer: language
    languages: [javascript, typescript]
    frameworks: [any, none]
  rust:
    kind: language
    layer: language
    languages: [rust]
    frameworks: [any, none]
  go:
    kind: language
    layer: language
    languages: [go]
    frameworks: [any, none]
  django:
    kind: framework
    layer: framework
    languages: [python]
    frameworks: [django]
  react:
    kind: framework
    layer: framework
    languages: [javascript, typescript]
    frameworks: [react]

capabilities:
  analysis:
    - symbols
    - imports
    - definitions
    - references
    - calls
    - writes
    - syntax-tree
    - type-facts
  refactor:
    - enum-migration
    - rename
    - move
    - reference-edit
  guard:
    - native-rule
    - ratchet
    - fault-visible

scan_targets:
  python:
    adapter: python-ast
    support: experimental
    evidence_contract: executable-skill-script
  javascript:
    adapter: javascript-syntax
    support: experimental
    evidence_contract: executable-skill-script
  typescript:
    adapter: typescript-syntax
    support: experimental
    evidence_contract: executable-skill-script
  templates:
    adapter: text-template
    support: experimental
    evidence_contract: executable-skill-script
  markdown:
    adapter: structured-text
    support: experimental
    evidence_contract: executable-skill-script
  rust:
    shim: cargo
    support: unsupported
    evidence_contract: native-tool-fixture
  go:
    shim: go-toolchain
    support: unsupported
    evidence_contract: native-tool-fixture

sweep_targets:
  python: [ruff, cx, omnibus]
  javascript: [eslint]
  typescript: [eslint, typescript-compiler, omnibus]
  rust: [clippy]
  go: [go-vet]

sweep_providers:
  cx:
    languages: [python]
    provider_kind: parser-backed-ecosystem
    runner: complexity
    timeout_seconds: 30
    output_format: json-lines
    output_byte_limit: 1048576
    semantic_rule_version: 1
  omnibus:
    languages: [python, typescript]
    provider_kind: parser-backed-ecosystem
    runner: omnibus
    timeout_seconds: 30
    output_format: json-lines
    output_byte_limit: 1048576
    semantic_rule_version: 1
  ruff:
    languages: [python]
    provider_kind: native
    executable: [.venv/bin/ruff, ruff]
    argv: [check, --output-format, json, --no-cache, .]
    version_argv: [--version]
    version_pattern: '^ruff [0-9]+\.[0-9]+\.[0-9]+$'
    timeout_seconds: 30
    output_format: ruff-json
    output_stream: stdout
    output_byte_limit: 1048576
    clean_exit_codes: [0]
    diagnostic_exit_codes: [1]
    semantic_rule_version: 1
  eslint:
    languages: [javascript, typescript]
    provider_kind: native
    executable: [node_modules/.bin/eslint, eslint]
    argv: [--format, json, .]
    version_argv: [--version]
    version_pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    timeout_seconds: 30
    output_format: eslint-json
    output_stream: stdout
    output_byte_limit: 1048576
    clean_exit_codes: [0]
    diagnostic_exit_codes: [1]
    semantic_rule_version: 1
  typescript-compiler:
    languages: [typescript]
    provider_kind: native
    executable: [node_modules/.bin/tsc, tsc]
    argv: [--pretty, 'false', --noEmit, --project, tsconfig.json]
    version_argv: [--version]
    version_pattern: '^Version [0-9]+\.[0-9]+\.[0-9]+$'
    timeout_seconds: 30
    output_format: typescript-diagnostics-text
    output_stream: stdout
    output_byte_limit: 1048576
    clean_exit_codes: [0]
    diagnostic_exit_codes: [1, 2]
    semantic_rule_version: 1
  clippy:
    languages: [rust]
    provider_kind: native
    executable: [cargo]
    argv: [clippy, --message-format, json, --all-targets, --all-features]
    version_argv: [clippy, --version]
    version_pattern: '^clippy [0-9]+\.[0-9]+\.[0-9]+(?: .*)?$'
    timeout_seconds: 120
    output_format: cargo-json-lines
    output_stream: stdout
    output_byte_limit: 4194304
    clean_exit_codes: [0]
    diagnostic_exit_codes: []
    semantic_rule_version: 1
  go-vet:
    languages: [go]
    provider_kind: native
    executable: [go]
    argv: [vet, -json, ./...]
    version_argv: [tool, vet, '-V=full']
    version_pattern: '^vet version go[0-9]+\.[0-9]+(?:\.[0-9]+)?(?: .*)?$'
    timeout_seconds: 120
    output_format: go-vet-json
    output_stream: stdout-or-stderr
    output_byte_limit: 4194304
    clean_exit_codes: [0]
    diagnostic_exit_codes: [1]
    semantic_rule_version: 1

support:
  verification_issuer:
    id: cross-stack-conformance-v1
    owner_wp: WP8
    status: unavailable
    path: scripts/cross_stack_conformance.py
    sha256: null
  states:
    unsupported:
      rank: 0
      required_evidence: []
    experimental:
      rank: 1
      required_evidence: [subject_fixtures, canonical_observations, artifact_hashes, tool_probes, platforms, evidence_hash]
    verified:
      rank: 2
      required_evidence: [subject_fixtures, canonical_observations, artifact_hashes, tool_probes, platforms, evidence_hash]
  transitions:
    promote:
      unsupported: experimental
      experimental: verified
    demote_on:
      - fixture_failure
      - missing_required_evidence
      - tool_version_outside_verified_range
      - unsupported_platform

agent_surfaces:
  claude-code:
    minimum_contract_version: 1
    minimum_surface_version: 2.1.211
    discovery: claude-skill-directory-v1
  codex:
    minimum_contract_version: 1
    minimum_surface_version: 0.144.1
    discovery: codex-plugin-manifest-v1
  augment:
    minimum_contract_version: 1
    minimum_surface_version: imported-rules-v1
    discovery: augment-imported-rules-v1
  cursor:
    minimum_contract_version: 1
    minimum_surface_version: project-rules-v1
    discovery: cursor-project-instructions-v1
  gemini:
    minimum_contract_version: 1
    minimum_surface_version: 0.45.0
    discovery: gemini-project-instructions-v1

completion_capabilities:
  profile: {owner_wp: WP2}
  profile.per-root: {owner_wp: WP2}
  routing: {owner_wp: WP2}
  perimeter: {owner_wp: WP2}
  installation: {owner_wp: WP3}
  binding.isolation: {owner_wp: WP3}
  composition.mixed-host: {owner_wp: WP3}
  analysis.symbols: {owner_wp: WP4}
  analysis.imports: {owner_wp: WP4}
  analysis.definitions: {owner_wp: WP4}
  analysis.references: {owner_wp: WP4}
  analysis.calls: {owner_wp: WP4}
  analysis.writes: {owner_wp: WP4}
  analysis.required-facts: {owner_wp: WP4}
  analysis.parser-refactor: {owner_wp: WP4}
  sweep.batch: {owner_wp: WP5}
  sweep.native: {owner_wp: WP5}
  sweep.native-aggregation: {owner_wp: WP5}
  failure.loud: {owner_wp: WP5}
  finding-id.non-colliding: {owner_wp: WP5}
  detector.omnibus: {owner_wp: WP6}
  detector.typed-state: {owner_wp: WP6}
  detector.non-native: {owner_wp: WP6}
  refactor.enum: {owner_wp: WP7}
  refactor.cross-language-semantic: {owner_wp: WP7}
  guard.native: {owner_wp: WP7}
  catalog.compatibility: {owner_wp: WP8}
  catalog.broader: {owner_wp: WP8}
  detector.optional-new-family: {owner_wp: WP8}

completion_floor:
  matrix_version: 1
  change_control: adr-amendment-and-migration-review
  required_agent_surfaces: [claude-code, codex, augment, cursor, gemini]
  stacks:
    python-django:
      languages: [python]
      frameworks: [django]
      required:
        - profile
        - routing
        - perimeter
        - installation
        - analysis.required-facts
        - sweep.batch
        - refactor.enum
        - guard.native
        - catalog.compatibility
      experimental_allowed: [detector.optional-new-family]
    typescript-node-react:
      languages: [typescript]
      frameworks: [react]
      required:
        - profile
        - routing
        - perimeter
        - installation
        - analysis.symbols
        - analysis.imports
        - analysis.definitions
        - analysis.references
        - analysis.calls
        - analysis.writes
        - sweep.batch
        - detector.omnibus
        - detector.typed-state
        - refactor.enum
        - guard.native
      experimental_allowed: [catalog.broader]
    rust:
      languages: [rust]
      frameworks: [none]
      required: [profile, routing, perimeter, installation, sweep.native, failure.loud, composition.mixed-host]
      experimental_allowed: [analysis.parser-refactor, detector.non-native]
    go:
      languages: [go]
      frameworks: [none]
      required: [profile, routing, perimeter, installation, sweep.native, failure.loud, composition.mixed-host]
      experimental_allowed: [analysis.parser-refactor, detector.non-native]
    mixed-monorepo:
      languages: [python, typescript, rust, go]
      frameworks: [django, react]
      required:
        - profile.per-root
        - binding.isolation
        - routing
        - perimeter
        - sweep.native-aggregation
        - finding-id.non-colliding
      experimental_allowed: [refactor.cross-language-semantic]
