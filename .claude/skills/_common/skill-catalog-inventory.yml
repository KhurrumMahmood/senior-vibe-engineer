    placement: concept-plus-binding
  universal-python-binding:
    description: Universal concept with Python-specific mechanics in a thin binding.
    layer: core
    placement: concept-plus-binding
  universal-python-django-bindings:
    description: Universal concept with Python mechanics and Django idioms in thin bindings.
